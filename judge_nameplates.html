<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>심사위원 이름표 — 2026 아세안 차세대 글로벌 창업무역스쿨</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; margin: 0; color: #1d233b; background: #f0f2f5; }

  .toolbar { padding: 1rem 1.2rem; background: #fff; border-bottom: 1px solid #d8dce4; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  .toolbar button { font-size: 1rem; padding: 0.6rem 1.4rem; border-radius: 8px; border: none; background: #002d6c; color: #fff; cursor: pointer; }
  .toolbar label { font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; }
  .toolbar input { width: 4.5rem; padding: 0.4rem 0.5rem; border: 1px solid #b9bfcc; border-radius: 6px; font: inherit; }
  .toolbar span { color: #5f5f5f; font-size: 0.88rem; max-width: 70ch; line-height: 1.55; }

  /* A4 가로 1장 = 이름표 1개.
     가로로 반 접으면 삼각기둥(텐트형)이 되도록 위/아래 두 면에 같은 내용을 인쇄한다.
     위쪽 면은 180° 뒤집어 두어야 접었을 때 뒷면 글씨가 바로 선다. */
  .sheet { width: 297mm; height: 210mm; margin: 0 auto; padding: 0; background: #fff; display: flex; flex-direction: column; page-break-after: always; position: relative; }
  .sheet:last-child { page-break-after: auto; }

  .face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6mm; padding: 10mm 14mm; min-height: 0; }
  .face.back { transform: rotate(180deg); }

  .face .eyebrow { font-family: ui-monospace, "SF Mono", monospace; font-size: 4mm; letter-spacing: 0.22em; color: #b45309; text-transform: uppercase; }
  /* 손글씨로 이름을 쓰는 칸 */
  .face .nameline { width: 100%; max-width: 210mm; height: 26mm; border-bottom: 1mm solid #002d6c; }
  .face .role { font-size: 6.5mm; font-weight: 700; letter-spacing: 0.04em; color: #002d6c; }
  .face .org { font-family: ui-monospace, "SF Mono", monospace; font-size: 4mm; color: #5f5f5f; letter-spacing: 0.06em; }

  /* 접는선 — 시트 정중앙 */
  .foldline { position: absolute; left: 0; right: 0; top: 50%; border-top: 0.4mm dashed #9aa1b1; }
  .foldlabel { position: absolute; left: 6mm; top: 50%; transform: translateY(-50%); background: #fff; padding: 0 2mm; font-family: ui-monospace, "SF Mono", monospace; font-size: 3mm; color: #9aa1b1; letter-spacing: 0.1em; }

  @media print {
    .toolbar { display: none; }
    body { background: #fff; }
    @page { size: A4 landscape; margin: 0; }
  }
  @media screen {
    .sheet { box-shadow: 0 2px 14px rgba(0, 0, 0, 0.12); margin-top: 8mm; margin-bottom: 8mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <label>매수 <input type="number" id="count" value="15" min="1" max="60"></label>
    <button id="regen" type="button">다시 생성</button>
    <button id="print" type="button">인쇄</button>
    <span>
      A4 <b>가로</b> 1장 = 이름표 1개. 인쇄 후 가운데 점선을 따라 반으로 접고 양 끝을 맞대면
      <b>삼각기둥(텐트형)</b>으로 세워집니다. 위쪽 면은 뒤집혀 인쇄되어 있어 접으면 뒷면 글씨가 바로 섭니다.
      이름은 손글씨로 적을 수 있게 빈칸으로 두었습니다. 두꺼운 종이(200g 이상)에 출력하면 잘 섭니다.
    </span>
  </div>
  <div id="sheets"></div>

<script>
function plate() {
  const face = (cls) => `
    <div class="face ${cls}">
      <div class="eyebrow">Judge</div>
      <div class="nameline"></div>
      <div class="role">심사위원</div>
      <div class="org">2026 아세안 차세대 글로벌 창업무역스쿨 · Singapore</div>
    </div>`;
  return `
    <div class="sheet">
      ${face('back')}
      <div class="foldline"></div><div class="foldlabel">FOLD</div>
      ${face('front')}
    </div>`;
}

function render() {
  const n = Math.max(1, Math.min(60, parseInt(document.getElementById('count').value, 10) || 1));
  document.getElementById('sheets').innerHTML = Array.from({ length: n }, plate).join('');
}

document.getElementById('regen').addEventListener('click', render);
document.getElementById('print').addEventListener('click', () => window.print());
render();
</script>
</body>
</html>
