/* ===================== 사다리(Ladder) 위젯 — Canvas 기반, 조별 클릭 확인 지원 ===================== */

// 사다리 기하 — 화면에 맞춰 렌더 직전에 정한다 (ladderFitGeometry 참고)
let LADDER_MARGIN = 68;   // 양 끝 칩의 절반 폭보다 커야 삐져나가지 않는다
let LADDER_LANE_GAP = 128;
let LADDER_CANVAS_H = 220;

// 실제 컨테이너 폭·화면 높이를 재서 레인 간격과 사다리 높이를 잡는다.
// innerWidth 로 추정하면 스텁/여백 때문에 어긋나서 10번째 조가 잘렸다.
function ladderFitGeometry(container) {
  const avail = container.clientWidth || window.innerWidth;
  LADDER_LANE_GAP = Math.round(Math.min(130, Math.max(76, (avail - LADDER_MARGIN * 2) / 9)));
  // 결과 요약 그리드가 아래에 붙으므로 캔버스를 조금 낮춘다 (전체화면에서 요약이 잘리지 않게)
  LADDER_CANVAS_H = Math.round(Math.min(300, Math.max(150, window.innerHeight * 0.195)));
}
const LADDER_STEPS = 12;
const LADDER_PALETTE_VARS = ['--accent-gold', '--accent-navy', '--accent-red', '--accent-green'];

let activeLadder = null;
let activeLadderDrag = null;

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function ladderLaneX(i) {
  return LADDER_MARGIN + i * LADDER_LANE_GAP;
}
function ladderStepY(r) {
  return (r + 1) * (LADDER_CANVAS_H / (LADDER_STEPS + 1));
}
function ladderCanvasWidth(n) {
  return LADDER_MARGIN * 2 + Math.max(0, n - 1) * LADDER_LANE_GAP;
}
function ladderPolylineLength(points) {
  let len = 0;
  for (let i = 1; i < points.length; i++) len += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
  return len;
}
function ladderClampDuration(len) {
  return Math.max(650, Math.min(2600, (len / 260) * 1000));
}
function ladderPointAtDistance(points, d) {
  let acc = 0;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    if (acc + segLen >= d || i === points.length - 1) {
      const t = segLen === 0 ? 1 : Math.max(0, Math.min(1, (d - acc) / segLen));
      return { cutIndex: i, point: { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t } };
    }
    acc += segLen;
  }
  return { cutIndex: points.length - 1, point: points[points.length - 1] };
}

function buildLadderRungs(n) {
  const rungs = [];
  for (let r = 0; r < LADDER_STEPS; r++) {
    const used = new Array(n).fill(false);
    const set = new Set();
    for (let g = 0; g < n - 1; g++) {
      if (!used[g] && !used[g + 1] && Math.random() < 0.32) {
        set.add(g); used[g] = true; used[g + 1] = true;
      }
    }
    rungs.push(set);
  }
  return rungs;
}

// 아래 결과칸은 미리 공개되므로 로케이션이 한쪽으로 몰리지 않게 균등 분배(10칸 → 3·3·2·2) 후 순서만 섞는다
function buildBalancedLocIdx(n) {
  const idx = Array.from({ length: n }, (_, i) => i % LOCATIONS.length);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

function buildLadderPath(data, startCol) {
  const n = TEAMS.length;
  let col = startCol;
  const pts = [{ x: ladderLaneX(col), y: 0 }];
  for (let r = 0; r < LADDER_STEPS; r++) {
    const y = ladderStepY(r);
    pts.push({ x: ladderLaneX(col), y });
    if (data.rungs[r].has(col - 1)) { col -= 1; pts.push({ x: ladderLaneX(col), y }); }
    else if (data.rungs[r].has(col)) { col += 1; pts.push({ x: ladderLaneX(col), y }); }
  }
  pts.push({ x: ladderLaneX(col), y: LADDER_CANVAS_H });
  return { points: pts, endCol: col };
}

// keepBoard=true 이면 가로선만 새로 만들고 로케이션 순서·조 순서는 유지한다 (다시 뽑기 / R)
function renderLadder(container, keepBoard) {
  ladderFitGeometry(container);
  const n = TEAMS.length;
  const prev = container._ladderState;
  const data = {
    rungs: buildLadderRungs(n),
    bottomLocIdx: (keepBoard && prev && prev.bottomLocIdx) || buildBalancedLocIdx(n),
    teamOrder: (keepBoard && prev && prev.teamOrder) || [...TEAMS],
  };
  container._ladderState = data;
  const canvas = container.querySelector('[data-ladder-canvas]');
  const namesRow = container.querySelector('[data-ladder-names]');
  const resultsRow = container.querySelector('[data-ladder-results]');

  const summaryBox = container.querySelector('[data-ladder-summary]');
  const goBtn = container.querySelector('[data-ladder-go]');
  const nextBtn = container.querySelector('[data-ladder-next]');
  const resetBtn = container.querySelector('[data-ladder-reset]');
  const ctx = canvas.getContext('2d');

  const w = ladderCanvasWidth(n);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = LADDER_CANVAS_H * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = LADDER_CANVAS_H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const trackBox = container.querySelector('.ladder-track-box');
  trackBox.style.width = w + 'px';
  // 결과칸 폭을 레인 간격에 맞춘다 (옆칸과 붙지 않게 8px 띄움)
  trackBox.style.setProperty('--result-w', (LADDER_LANE_GAP - 8) + 'px');

  function drawBase() {
    ctx.clearRect(0, 0, w, LADDER_CANVAS_H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = cssVar('--line');
    ctx.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      const x = ladderLaneX(i);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LADDER_CANVAS_H); ctx.stroke();
    }
    for (let r = 0; r < LADDER_STEPS; r++) {
      const y = ladderStepY(r);
      data.rungs[r].forEach((g) => {
        ctx.beginPath(); ctx.moveTo(ladderLaneX(g), y); ctx.lineTo(ladderLaneX(g + 1), y); ctx.stroke();
      });
    }
  }
  function drawFullTrace(points, color) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.shadowColor = color; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke(); ctx.restore();
  }
  function drawPartialTrace(points, d, color) {
    const cut = ladderPointAtDistance(points, d);
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.shadowColor = color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < cut.cutIndex; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.lineTo(cut.point.x, cut.point.y);
    ctx.stroke();
    ctx.beginPath(); ctx.fillStyle = color; ctx.arc(cut.point.x, cut.point.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const paths = TEAMS.map((_, i) => {
    const p = buildLadderPath(data, i);
    return { points: p.points, endCol: p.endCol, totalLen: ladderPolylineLength(p.points) };
  });

  let completed = [];
  let active = [];
  let rafId = null;
  let busy = false;

  // 아직 안 나온 조 중 가장 작은 번호 (1조 → 10조 순서로 하나씩 뽑는다)
  function nextTeamNo() {
    const shown = new Set(completed.map((t) => data.teamOrder[t.lane]));
    return [...TEAMS].sort((a, b) => a - b).find((no) => !shown.has(no));
  }
  function updateButtons() {
    goBtn.disabled = busy;
    if (!nextBtn) return;
    const remaining = nextTeamNo();
    nextBtn.disabled = busy || remaining === undefined;
    nextBtn.textContent = remaining === undefined ? '추첨 완료' : `${remaining}조 뽑기`;
  }
  // 한 조만 공개 — 이미 나온 조는 그대로 두고 다음 번호만 이어서 그린다
  function revealNextTeam() {
    if (busy) return;
    const teamNo = nextTeamNo();
    if (teamNo === undefined) return;
    const lane = data.teamOrder.indexOf(teamNo);
    if (lane < 0) return;
    const palette = LADDER_PALETTE_VARS.map(cssVar);
    const p = paths[lane];
    const t = { points: p.points, totalLen: p.totalLen, endCol: p.endCol, lane, color: palette[lane % palette.length] };
    if (reduceMotion) {
      completed.push(t); onComplete(t);
      drawBase(); completed.forEach((c) => drawFullTrace(c.points, c.color));
      renderSummary(); updateButtons();
      return;
    }
    busy = true; updateButtons();
    active.push({ ...t, start: performance.now(), duration: ladderClampDuration(p.totalLen) });
    if (!rafId) rafId = requestAnimationFrame(render);
  }
  // 장소별로 묶은 결과 요약 — 전체 공개가 끝났을 때만 채운다
  function renderSummary() {
    if (!summaryBox || completed.length < TEAMS.length) return;
    const byLoc = new Map();
    completed.forEach((t) => {
      const locIdx = data.bottomLocIdx[t.endCol];
      if (!byLoc.has(locIdx)) byLoc.set(locIdx, []);
      byLoc.get(locIdx).push(data.teamOrder[t.lane]);
    });
    summaryBox.innerHTML = [...byLoc.entries()]
      .sort((a, b) => a[0] - b[0])
      .map(([locIdx, teams]) => {
        const loc = LOCATIONS[locIdx];
        const m = loc.name.match(/^(.+?)\s*\((.+?)\)$/);
        const teamList = teams.slice().sort((x, y) => x - y).map((n) => `${n}조`).join(' · ');
        return `<div class="ls-card"><div class="ls-loc" title="${loc.name}">${loc.no} ${m ? m[1] : loc.name}</div><div class="ls-teams">${teamList}</div></div>`;
      }).join('');
    summaryBox.classList.add('show');
  }
  function clearSummary() {
    if (!summaryBox) return;
    summaryBox.classList.remove('show');
    summaryBox.innerHTML = '';
  }
  function onComplete(t) {
    // 결과칸의 번호는 처음부터 보이므로 여기서는 강조만 입힌다
    const chip = resultsRow.querySelector(`[data-col="${t.endCol}"]`);
    if (chip) {
      chip.style.setProperty('--hit-color', t.color);
      chip.classList.add('hit');
    }
  }
  function render(now) {
    drawBase();
    completed.forEach((t) => drawFullTrace(t.points, t.color));
    let going = false;
    for (let j = active.length - 1; j >= 0; j--) {
      const t = active[j];
      const elapsed = Math.max(0, now - t.start);
      const p = Math.min(1, elapsed / t.duration);
      if (p >= 0) drawPartialTrace(t.points, p * t.totalLen, t.color);
      if (p >= 1) { completed.push(t); onComplete(t); active.splice(j, 1); }
      else going = true;
    }
    if (going) {
      rafId = requestAnimationFrame(render);
    } else {
      rafId = null; busy = false; updateButtons();

      renderSummary();
    }
  }

  // 공개된 경로·강조를 지우고 추첨 전 상태로 되돌린다 (순서를 바꾸면 기존 결과가 무효이므로)
  function clearReveal() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    completed = []; active = []; busy = false;
    resultsRow.querySelectorAll('.hit').forEach((el) => el.classList.remove('hit'));

    clearSummary();
    drawBase();
    updateButtons();
  }

  function revealAll() {
    if (busy) return;
    clearReveal();
    const palette = LADDER_PALETTE_VARS.map(cssVar);
    if (reduceMotion) {
      TEAMS.forEach((_, i) => {
        const p = paths[i];
        const t = { points: p.points, totalLen: p.totalLen, endCol: p.endCol, lane: i, color: palette[i % palette.length], silent: true };
        completed.push(t); onComplete(t);
      });
      drawBase(); completed.forEach((t) => drawFullTrace(t.points, t.color));
      renderSummary();
      return;
    }
    busy = true; updateButtons();
    const now = performance.now();
    TEAMS.forEach((_, i) => {
      const p = paths[i];
      active.push({ points: p.points, totalLen: p.totalLen, endCol: p.endCol, lane: i, color: palette[i % palette.length], start: now + i * 90, duration: ladderClampDuration(p.totalLen), silent: true });
    });
    if (!rafId) rafId = requestAnimationFrame(render);
  }

  namesRow.innerHTML = '';
  resultsRow.innerHTML = '';
  const btnByTeam = new Map();
  data.teamOrder.forEach((teamNo, lane) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ladder-chip name'; btn.style.left = ladderLaneX(lane) + 'px';
    btn.dataset.team = String(teamNo); btn.textContent = `${teamNo}조`;
    btn.title = `끌어서 ${teamNo}조의 순서를 바꿉니다`;
    btnByTeam.set(teamNo, btn);
    namesRow.appendChild(btn);
  });
  TEAMS.forEach((_, i) => {
    const loc = LOCATIONS[data.bottomLocIdx[i]];
    const res = document.createElement('div');
    res.className = 'ladder-chip result'; res.style.left = ladderLaneX(i) + 'px';
    res.dataset.col = String(i);
    const m = loc.name.match(/^(.+?)\s*\((.+?)\)$/);
    res.textContent = m ? m[1] : loc.name;
    res.title = loc.name;
    resultsRow.appendChild(res);
  });

  /* ---- 조 이름표 드래그 재배열 (끼워넣기 방식) ---- */
  let drag = null;

  function layoutNames(order, exceptTeam) {
    order.forEach((teamNo, lane) => {
      if (teamNo === exceptTeam) return;
      btnByTeam.get(teamNo).style.left = ladderLaneX(lane) + 'px';
    });
  }

  function endDrag(commit) {
    if (!drag) return;
    const btn = btnByTeam.get(drag.teamNo);
    btn.classList.remove('dragging');
    if (commit && drag.preview.some((t, i) => t !== data.teamOrder[i])) {
      data.teamOrder = drag.preview;
      clearReveal();
    }
    drag = null;
    activeLadderDrag = null;
    layoutNames(data.teamOrder, null);
  }

  btnByTeam.forEach((btn, teamNo) => {
    btn.addEventListener('pointerdown', (e) => {
      if (busy || drag) return;
      e.preventDefault();
      const box = namesRow.getBoundingClientRect();
      const lane = data.teamOrder.indexOf(teamNo);
      drag = { teamNo, box, grabDx: e.clientX - box.left - ladderLaneX(lane), preview: [...data.teamOrder] };
      activeLadderDrag = () => endDrag(false);
      btn.classList.add('dragging');
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    });
    btn.addEventListener('pointermove', (e) => {
      if (!drag || drag.teamNo !== teamNo) return;
      const x = e.clientX - drag.box.left - drag.grabDx;
      btn.style.left = x + 'px';
      const target = Math.max(0, Math.min(n - 1, Math.round((x - LADDER_MARGIN) / LADDER_LANE_GAP)));
      const cur = drag.preview.indexOf(teamNo);
      if (cur !== target) {
        drag.preview.splice(cur, 1);
        drag.preview.splice(target, 0, teamNo);
        layoutNames(drag.preview, teamNo);
      }
    });
    btn.addEventListener('pointerup', () => endDrag(true));
    btn.addEventListener('pointercancel', () => endDrag(false));
  });

  drawBase();

  clearSummary();
  updateButtons();

  goBtn.onclick = revealAll;
  if (nextBtn) nextBtn.onclick = revealNextTeam;
  resetBtn.onclick = () => renderLadder(container, true);

  activeLadder = { container };
}

function resetActiveLadder() {
  if (activeLadder) renderLadder(activeLadder.container, true);
}

document.querySelectorAll('[data-ladder]').forEach((el) => renderLadder(el));
// 드래그 중 Esc → 원위치 복귀
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && activeLadderDrag) activeLadderDrag();
});

/* ===================== 스핀 휠 위젯 (발표 순서 — 한 조씩 추첨) ===================== */

document.querySelectorAll('[data-wheel]').forEach((wrap) => {
  const disc = wrap.querySelector('[data-wheel-disc]');
  const canvas = wrap.querySelector('[data-wheel-canvas]');
  const goBtn = wrap.querySelector('[data-wheel-go]');
  const resetBtn = wrap.querySelector('[data-wheel-reset]');
  const orderBox = wrap.querySelector('[data-wheel-order-box]');
  const orderInner = wrap.querySelector('[data-wheel-order]');
  const latestBox = wrap.querySelector('[data-wheel-latest]');
  const latestRank = wrap.querySelector('[data-wheel-latest-rank]');
  const latestTeam = wrap.querySelector('[data-wheel-latest-team]');
  const ctx = canvas.getContext('2d');
  let pool = [];
  let order = [];
  let spinning = false;

  function drawWheel() {
    const size = disc.getBoundingClientRect().width || 380;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = size / 2;
    ctx.clearRect(0, 0, size, size);
    const n = pool.length;
    if (n === 0) return;
    const seg = (Math.PI * 2) / n;
    const navy = cssVar('--accent-navy');
    const navyDeep = cssVar('--accent-navy-deep');
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + i * seg;
      const a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(R, R); ctx.arc(R, R, R - 3, a0, a1); ctx.closePath();
      ctx.fillStyle = i % 2 === 0 ? navy : navyDeep;
      ctx.fill();
      const mid = a0 + seg / 2;
      const lx = R + Math.cos(mid) * (R * 0.62);
      const ly = R + Math.sin(mid) * (R * 0.62);
      ctx.fillStyle = '#eef1f6';
      ctx.font = `700 ${Math.max(20, Math.min(32, 130 / n))}px ${cssVar('--font-mono')}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`${pool[i]}조`, lx, ly);
    }
    ctx.beginPath(); ctx.arc(R, R, R - 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = navyDeep; ctx.lineWidth = 3; ctx.stroke();
  }

  function updateButtons() {
    goBtn.disabled = spinning || pool.length === 0;
    goBtn.textContent = pool.length === 0 ? '추첨 완료' : '다음 순서 뽑기';
  }

  function snapToZero() {
    disc.style.transition = 'none';
    disc.style.transform = 'rotate(0deg)';
    void disc.offsetWidth;
    disc.style.transition = '';
  }

  function init() {
    pool = [...TEAMS];
    order = [];
    spinning = false;
    wrap.classList.remove('revealed');
    orderBox.classList.remove('show');
    orderInner.innerHTML = '';
    latestBox.classList.remove('show');
    latestRank.textContent = '';
    latestTeam.textContent = '';
    snapToZero();
    drawWheel();
    updateButtons();
  }

  function finishDraw(winnerIdx) {
    const team = pool[winnerIdx];
    pool.splice(winnerIdx, 1);
    order.push(team);
    orderInner.innerHTML = order.map((n, i) => `<div class="wheel-order-row"><span class="rank">${i + 1}</span><span class="team">${n}조</span></div>`).join('');
    latestRank.textContent = `${order.length}번째 발표팀`;
    latestTeam.textContent = `${team}조`;
    latestBox.classList.remove('show'); void latestBox.offsetWidth; latestBox.classList.add('show');
    if (order.length === 1) {
      wrap.classList.add('revealed');
      orderBox.classList.add('show');
    }
    snapToZero();
    drawWheel();
    spinning = false;
    updateButtons();
  }

  goBtn.addEventListener('click', () => {
    if (spinning || pool.length === 0) return;
    spinning = true; updateButtons();
    const n = pool.length;
    const winnerIdx = Math.floor(Math.random() * n);
    const seg = 360 / n;
    const segCenterDeg = -90 + winnerIdx * seg + seg / 2;
    const delta = ((-90 - segCenterDeg) % 360 + 360) % 360;
    const spins = 3 + Math.floor(Math.random() * 2);
    const target = spins * 360 + delta;
    if (reduceMotion) {
      finishDraw(winnerIdx);
    } else {
      disc.style.transform = `rotate(${target}deg)`;
      disc.addEventListener('transitionend', function handler() {
        disc.removeEventListener('transitionend', handler);
        finishDraw(winnerIdx);
      }, { once: true });
    }
  });

  resetBtn.addEventListener('click', init);

  init();

  // 컨테이너 크기가 바뀌면(전체화면 전환 등) 캔버스를 다시 그린다 — 안 그러면
  // 이전 크기로 고정된 캔버스가 CSS 로 커진 새 박스 안에서 화살표와 어긋나 보인다.
  let wheelRedrawTimer = null;
  const scheduleWheelRedraw = () => {
    clearTimeout(wheelRedrawTimer);
    wheelRedrawTimer = setTimeout(drawWheel, 60);
  };
  window.addEventListener('resize', scheduleWheelRedraw);
  ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach((evt) => {
    document.addEventListener(evt, scheduleWheelRedraw);
  });
});

/* ===================== 빙고 게임 (클릭 체크 + 한 줄 완성 시 BINGO!) ===================== */

document.querySelectorAll('[data-bingo]').forEach((wrap) => {
  const panel = wrap.parentElement;
  const callBtn = panel.querySelector('[data-bingo-call]');
  const undoBtn = panel.querySelector('[data-bingo-undo]');
  const resetBtn = panel.querySelector('[data-bingo-reset]');
  const shoutBtn = panel.querySelector('[data-bingo-shout]');
  const currentBox = panel.querySelector('[data-bingo-current]');
  const calledBox = panel.querySelector('[data-bingo-called]');
  const toast = panel.querySelector('[data-bingo-toast]');
  let toastTimer = null;

  // 화면 빙고판이 없으므로 줄 완성 판정도 없다 — 참가자가 외치면 MC 가 버튼(또는 B)으로 띄운다
  function showBingoToast() {
    if (!toast) return;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }

  /* ---- 이름 호명 — 참가자 명단에서 중복 없이 한 명씩 뽑는다 ---- */
  let pool = [];
  let called = [];

  function renderCaller() {
    const last = called[called.length - 1];
    currentBox.innerHTML = last
      ? `${escapeHtml(last.name)}<span class="bc-group">${escapeHtml(last.group)}</span>`
      : '—';
    calledBox.innerHTML = called.slice(0, -1).map((p) => `<span>${escapeHtml(p.name)}</span>`).join('');
    if (callBtn) callBtn.disabled = pool.length === 0;
    if (undoBtn) undoBtn.disabled = called.length === 0;
  }

  function callNext() {
    if (pool.length === 0) return;
    called.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    renderCaller();
  }

  function undoCall() {
    if (called.length === 0) return;
    pool.push(called.pop());
    renderCaller();
  }

  function resetAll() {
    pool = PARTICIPANTS.slice();
    called = [];
    renderCaller();
  }

  resetAll();
  if (callBtn) callBtn.addEventListener('click', callNext);
  if (undoBtn) undoBtn.addEventListener('click', undoCall);
  if (resetBtn) resetBtn.addEventListener('click', resetAll);
  if (shoutBtn) shoutBtn.addEventListener('click', showBingoToast);
});

/* ===================== Global Mixer 궤도 애니메이션 ===================== */

document.querySelectorAll('[data-mixer]').forEach((wrap) => {
  const orbit = wrap.querySelector('[data-mixer-orbit]');
  const chips = wrap.querySelectorAll('[data-mixer-chip]');
  const goBtn = wrap.querySelector('[data-mixer-go]');
  const groupsBox = wrap.querySelector('[data-mixer-groups]');
  goBtn.addEventListener('click', () => {
    wrap.classList.remove('revealed');
    groupsBox.classList.remove('show');
    const finalAngle = 720 + Math.floor(Math.random() * 360);
    orbit.style.setProperty('--final-angle', finalAngle + 'deg');
    orbit.classList.remove('spin'); void orbit.offsetWidth; orbit.classList.add('spin');
    chips.forEach((chip) => {
      chip.style.setProperty('--final-angle', finalAngle + 'deg');
      chip.classList.remove('spin'); void chip.offsetWidth; chip.classList.add('spin');
    });
    const delay = reduceMotion ? 0 : 3600;
    setTimeout(() => {
      wrap.classList.add('revealed');
      groupsBox.classList.add('show');
    }, delay);
  });
});

/* ===================== 좌석 배치도 배경 불꽃놀이 + 배너 비행기 ===================== */

document.querySelectorAll('[data-seating-fx]').forEach((fx) => {
  const stage = fx.closest('.ticket');
  const plane = stage.querySelector('[data-seating-plane]');
  const noFlight = fx.hasAttribute('data-no-flight');
  const fctx = fx.getContext('2d');
  const pctx = plane.getContext('2d');

  const oktaLogoImg = new Image();
  oktaLogoImg.src = 'logo/symbol_CI_250613_trimmed.png';
  const koreaFlagImg = new Image();
  koreaFlagImg.src = 'assets/korea-flag.png';
  const planeSprite = new Image();
  planeSprite.src = 'assets/plane_sprite.png';

  const PLANE_FRAME_COUNT = 25;
  const PLANE_FRAME_MS = 120;
  const PLANE_SRC_W = 338, PLANE_SRC_H = 150;
  const PLANE_DISPLAY_W = 158, PLANE_DISPLAY_H = 70;
  const PLANE_TAIL_OFFSET = 66;
  const WELCOME_TEXT = '싱가포르에 오신 것을 환영합니다';
  const bannerOrder = ['flag', 'logo', 'welcome'];
  const palette = ['#ef233c', '#ffb703', '#0891b2'];
  const bldgColor1 = '#16233f', bldgColor2 = '#2c3d68', windowGold = '#ffb703', shadowSoft = 'rgba(22,35,63,.14)';
  const bannerFontStack = cssVar('--font-body') || 'sans-serif';

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let rockets = [];
  let nextSpawn = { L: 0, R: 0 };
  let flight = null;
  let flightCount = 0;
  let nextFlightAt = 0;
  let lastT = 0;
  let rafId = null;
  let running = false;

  function resize() {
    const rect = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    [fx, plane].forEach((c) => {
      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.getContext('2d').setTransform(DPR, 0, 0, DPR, 0, 0);
    });
  }

  function zoneX(side) {
    const third = W / 3;
    const margin = third * 0.16;
    return side === 'L'
      ? margin + Math.random() * (third - margin * 2)
      : (2 * third) + margin + Math.random() * (third - margin * 2);
  }

  function spawnRocket(side) {
    rockets.push({
      x: zoneX(side), y: H * 0.86, targetY: H * 0.16 + Math.random() * H * 0.30,
      vy: -(4.2 + Math.random() * 1.6), color: palette[Math.floor(Math.random() * 3)], side,
    });
  }

  function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2) * (i / count) + Math.random() * 0.2;
      const speed = 1.4 + Math.random() * 3.2;
      particles.push({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        life: 0, maxLife: 46 + Math.random() * 30, color, size: 1.4 + Math.random() * 1.6,
      });
    }
  }

  function levelConfig() {
    return reduceMotion ? { rocketMs: [2600, 4200], count: 16 } : { rocketMs: [950, 1700], count: 34 };
  }

  function scheduleNext(side, t) {
    const cfg = levelConfig();
    const span = cfg.rocketMs[1] - cfg.rocketMs[0];
    nextSpawn[side] = t + cfg.rocketMs[0] + Math.random() * span;
  }

  function scheduleNextFlight(t) {
    nextFlightAt = t + 35000 + Math.random() * 13000;
  }

  function startFlight(t) {
    const dir = flightCount % 2 === 0 ? 1 : -1;
    const startX = dir === 1 ? -220 : W + 220;
    const endX = dir === 1 ? W + 220 : -220;
    const startY = H * 0.10 + Math.random() * H * 0.10;
    const endY = H * 0.35 + Math.random() * H * 0.10;
    const dx = endX - startX, dy = endY - startY;
    flight = {
      dir, type: bannerOrder[flightCount % bannerOrder.length],
      startX, startY, endX, endY, dx, dy,
      tilt: Math.atan2(Math.abs(dy), Math.abs(dx)),
      x: startX, y: startY, elapsed: 0, duration: 5000 + Math.random() * 1000, alpha: 0,
    };
    flightCount++;
  }

  function drawStar(ctx, cx, cy, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.42;
      const a = rot + i * Math.PI / 5;
      const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawFlagBanner(ctx, x, y, w, h) {
    const halfW = w / 2;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, halfW, h); ctx.clip();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, halfW, h);
    ctx.fillStyle = '#ef3340'; ctx.fillRect(x, y, halfW, h / 2);
    const ccx = x + halfW * 0.26, ccy = y + h * 0.26, cr = h * 0.17;
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ccx, ccy, cr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ef3340'; ctx.beginPath(); ctx.arc(ccx + cr * 0.45, ccy, cr * 0.86, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    const starPos = [[0.46, 0.10], [0.62, 0.17], [0.60, 0.34], [0.42, 0.35], [0.37, 0.18]];
    starPos.forEach(([sx, sy]) => drawStar(ctx, x + halfW * sx, y + h * sy, h * 0.05, -Math.PI / 2));
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.rect(x + halfW, y, halfW, h); ctx.clip();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + halfW, y, halfW, h);
    if (koreaFlagImg.complete && koreaFlagImg.naturalWidth) {
      const kScale = Math.min(halfW / koreaFlagImg.naturalWidth, h / koreaFlagImg.naturalHeight);
      const kw = koreaFlagImg.naturalWidth * kScale, kh = koreaFlagImg.naturalHeight * kScale;
      ctx.drawImage(koreaFlagImg, x + halfW + (halfW - kw) / 2, y + (h - kh) / 2, kw, kh);
    }
    ctx.restore();

    ctx.strokeStyle = shadowSoft; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.beginPath(); ctx.moveTo(x + halfW, y); ctx.lineTo(x + halfW, y + h); ctx.stroke();
  }

  function drawLogoBanner(ctx, x, y, w, h) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = shadowSoft; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (oktaLogoImg.complete && oktaLogoImg.naturalWidth) {
      const pad = 10;
      const scale = Math.min((w - pad * 2) / oktaLogoImg.naturalWidth, (h - pad * 2) / oktaLogoImg.naturalHeight);
      const iw = oktaLogoImg.naturalWidth * scale, ih = oktaLogoImg.naturalHeight * scale;
      ctx.drawImage(oktaLogoImg, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
    }
  }

  function drawWelcomeBanner(ctx, x, y, w, h, text) {
    const g = ctx.createLinearGradient(x, y, x + w, y);
    g.addColorStop(0, bldgColor1); g.addColorStop(1, bldgColor2);
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = windowGold; ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let size = 32;
    do {
      ctx.font = `700 ${size}px ${bannerFontStack}`;
      size -= 1;
    } while (ctx.measureText(text).width > w - 22 && size > 9);
    ctx.fillText(text, x + w / 2, y + h / 2);
  }

  function drawPlane(ctx, cx, cy, dir, tilt, alpha, t) {
    if (!planeSprite.complete || !planeSprite.naturalWidth) return;
    const frameIdx = Math.floor((t / PLANE_FRAME_MS) % PLANE_FRAME_COUNT);
    const sx = frameIdx * PLANE_SRC_W;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(dir * tilt);
    ctx.scale(-dir, 1);
    ctx.drawImage(
      planeSprite, sx, 0, PLANE_SRC_W, PLANE_SRC_H,
      -PLANE_DISPLAY_W / 2, -PLANE_DISPLAY_H / 2, PLANE_DISPLAY_W, PLANE_DISPLAY_H,
    );
    ctx.restore();
  }

  function renderFlight(f, t) {
    const len = Math.sqrt(f.dx * f.dx + f.dy * f.dy) || 1;
    const ux = f.dx / len, uy = f.dy / len;
    const perpX = -uy, perpY = ux;
    const bob = Math.sin(t * 0.006) * 4;
    const tailX = f.x - ux * PLANE_TAIL_OFFSET + perpX * bob;
    const tailY = f.y - uy * PLANE_TAIL_OFFSET + perpY * bob;
    const leadX = tailX - ux * 24, leadY = tailY - uy * 24;
    const w = f.type === 'welcome' ? 232 : 168, h = 52;
    const bx = f.dir === 1 ? (leadX - w) : leadX, by = leadY - h / 2;

    pctx.globalAlpha = f.alpha;
    pctx.strokeStyle = 'rgba(22,35,63,0.55)'; pctx.lineWidth = 1.4;
    pctx.beginPath(); pctx.moveTo(tailX, tailY);
    pctx.quadraticCurveTo((tailX + leadX) / 2, (tailY + leadY) / 2 + 8, leadX, leadY);
    pctx.stroke();

    if (f.type === 'flag') drawFlagBanner(pctx, bx, by, w, h);
    else if (f.type === 'logo') drawLogoBanner(pctx, bx, by, w, h);
    else drawWelcomeBanner(pctx, bx, by, w, h, WELCOME_TEXT);

    drawPlane(pctx, f.x, f.y, f.dir, f.tilt, f.alpha, t);
    pctx.globalAlpha = 1;
  }

  function drawZoneClipped(side, painter) {
    const third = W / 3;
    fctx.save();
    fctx.beginPath();
    if (side === 'L') fctx.rect(0, 0, third, H); else fctx.rect(2 * third, 0, third, H);
    fctx.clip();
    painter();
    fctx.restore();
  }

  function tick(t) {
    if (!lastT) lastT = t;
    const dt = Math.min(t - lastT, 48);
    lastT = t;

    if (t > nextSpawn.L) { spawnRocket('L'); scheduleNext('L', t); }
    if (t > nextSpawn.R) { spawnRocket('R'); scheduleNext('R', t); }

    if (!noFlight && !flight && t > nextFlightAt) startFlight(t);
    if (flight) {
      flight.elapsed += dt;
      const progress = Math.min(1, flight.elapsed / flight.duration);
      flight.x = flight.startX + flight.dx * progress;
      flight.y = flight.startY + flight.dy * progress;
      flight.alpha = progress < 0.12 ? progress / 0.12 : (progress > 0.88 ? (1 - progress) / 0.12 : 1);
      if (progress >= 1) { flight = null; scheduleNextFlight(t); }
    }

    pctx.clearRect(0, 0, W, H);
    if (flight) renderFlight(flight, t);

    fctx.clearRect(0, 0, W, H);
    ['L', 'R'].forEach((side) => {
      drawZoneClipped(side, () => {
        const third = W / 3;
        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          if (r.side !== side) continue;
          r.y += r.vy;
          fctx.shadowColor = r.color; fctx.shadowBlur = 10;
          fctx.fillStyle = r.color; fctx.globalAlpha = 0.9;
          fctx.beginPath(); fctx.arc(r.x, r.y, 2.1, 0, Math.PI * 2); fctx.fill();
          fctx.shadowBlur = 0;
          fctx.strokeStyle = r.color; fctx.globalAlpha = 0.35; fctx.lineWidth = 1.4;
          fctx.beginPath(); fctx.moveTo(r.x, r.y); fctx.lineTo(r.x, r.y - r.vy * 3.2); fctx.stroke();
          fctx.globalAlpha = 1;
          if (r.y <= r.targetY) {
            const cfg = levelConfig();
            explode(r.x, r.y, r.color, cfg.count);
            rockets.splice(i, 1);
          }
        }
        for (let j = particles.length - 1; j >= 0; j--) {
          const p = particles[j];
          const inSide = side === 'L' ? p.x < third : p.x >= 2 * third;
          if (!inSide) continue;
          p.life++;
          p.vy += 0.045; p.vx *= 0.985;
          p.x += p.vx; p.y += p.vy;
          const progress = p.life / p.maxLife;
          if (progress >= 1) { particles.splice(j, 1); continue; }
          fctx.globalAlpha = Math.max(0, 1 - progress);
          fctx.shadowColor = p.color; fctx.shadowBlur = 6;
          fctx.fillStyle = p.color;
          fctx.beginPath(); fctx.arc(p.x, p.y, p.size * (1 - progress * 0.4), 0, Math.PI * 2); fctx.fill();
        }
        fctx.shadowBlur = 0; fctx.globalAlpha = 1;
      });
    });

    if (running) rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    running = true;
    lastT = 0;
    particles = []; rockets = []; flight = null; flightCount = 0;
    resize();
    scheduleNext('L', performance.now());
    scheduleNext('R', performance.now() + 200);
    scheduleNextFlight(performance.now());
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  triggerSeatingFlight = () => {
    if (!running) return;
    flight = null;
    startFlight(performance.now());
  };

  window.addEventListener('resize', () => { if (running) resize(); });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => (entry.isIntersecting ? start() : stop()));
  }, { root: document.querySelector('.deck'), threshold: 0.2 });
  observer.observe(stage);
});

</script>
