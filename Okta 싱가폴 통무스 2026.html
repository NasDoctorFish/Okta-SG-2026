<title>2026 동서남아 통합 차세대 글로벌 창업무역스쿨 — 싱가포르</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f0f2f5;
    --bg-elevated: #ffffff;
    --ink: #1d233b;
    --ink-muted: #5f5f5f;
    --accent-gold: #b45309;
    --accent-navy: #145a9f;
    --accent-navy-deep: #002d6c;
    --accent-red: #ae2329;
    --accent-green: #1f7a4d;
    --line: rgba(29, 35, 59, 0.14);
    --notch: var(--bg);
    --shadow: 0 24px 70px -34px rgba(29, 35, 59, 0.45);

    --font-display: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "IBM Plex Mono", "Roboto Mono", monospace;

    /* 타이포 스케일 — 슬라이드별 하드코딩 대신 항상 이 토큰을 쓴다 */
    --fs-eyebrow: 1.02rem;      /* 상단 갈색 라벨 */
    --fs-h2: clamp(1.9rem, 3.6vw, 2.7rem);
    --fs-h2-lg: min(clamp(2.8rem, 6vw, 4.4rem), 120px);   /* 브레이크 등 대형 제목 · 상한 120px */
    --fs-lede: 1.15rem;
    --fs-body: 1.08rem;
    --fs-mono-sm: 0.85rem;      /* 시간·번호 등 보조 모노 */
    --fs-huge: min(clamp(3.2rem, 9vw, 5.5rem), 120px);   /* 상한 120px */
    --fs-btn: 1.05rem;

    --lh-tight: 1.25;
    --lh-body: 1.6;
    --gap-block: 0.5rem;        /* 슬라이드 내 블록 간 세로 간격 */
  }

  * { box-sizing: border-box; }
  html { font-size: clamp(14px, 2.6vh, 28px); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  ::selection { background: var(--accent-gold); color: var(--bg-elevated); }
  h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); }

  .eyebrow { font-family: var(--font-mono); font-size: var(--fs-eyebrow); letter-spacing: 0.16em; color: var(--accent-gold); text-transform: uppercase; }

  /* ---------- Chrome ---------- */
  .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 1rem clamp(1rem, 4vw, 2.5rem); gap: 1rem; background: var(--accent-navy-deep); border-bottom: 3px solid var(--accent-gold); }
  .topbar .brand { display: flex; align-items: baseline; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.84rem; letter-spacing: 0.08em; color: rgba(238, 241, 246, 0.72); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .brand b { color: #eef1f6; font-weight: 700; letter-spacing: 0.14em; }
  .topbar-right { display: flex; align-items: center; gap: 0.9rem; flex: none; }
  #counter {
    font-family: var(--font-mono); font-size: 0.86rem; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    max-width: min(46vw, 320px); background: rgba(238, 241, 246, 0.1); color: #eef1f6; border: 1px solid rgba(238, 241, 246, 0.3); border-radius: 8px;
    padding: 0.35rem 1.6rem 0.35rem 0.6rem; cursor: pointer; appearance: none; -webkit-appearance: none;
    text-overflow: ellipsis;
    background-image: linear-gradient(45deg, transparent 50%, #eef1f6 50%), linear-gradient(135deg, #eef1f6 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  #counter:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
  #counter option { font-family: var(--font-mono); color: var(--ink); background: var(--bg-elevated); }
  .iconbtn { background: none; border: 1px solid rgba(238, 241, 246, 0.3); color: #eef1f6; width: 2.1rem; height: 2.1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; transition: border-color 0.2s; }
  .iconbtn:hover { border-color: var(--accent-gold); }
  .iconbtn:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  /* ---------- Deck ---------- */
  .deck { flex: 1; position: relative; overflow: hidden; }
  .track { display: flex; width: 100%; height: 100%; transition: transform 0.3s cubic-bezier(0.65, 0, 0.35, 1); }
  @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
  .slide { flex: 0 0 100%; height: 100%; overflow-y: auto; display: flex; justify-content: center; }
  .ticket { position: relative; width: min(1680px, 94vw); margin: clamp(1rem, 2.6vh, 2.2rem) 0; background: var(--bg-elevated); border-radius: 18px; box-shadow: var(--shadow); display: flex; min-height: calc(100% - 2.2rem); overflow: hidden; }
  .schedule { align-items: stretch; overflow: hidden; }
  .schedule .ticket { width: 100%; height: 100%; min-height: 100%; margin: 0; border-radius: 0; box-shadow: none; }

  .stub { flex: none; width: 100px; padding: 1.4rem 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; background: linear-gradient(180deg, var(--accent-navy), var(--accent-navy-deep)); color: #eef1f6; position: relative; }
  .stub::after {
    content: ""; position: absolute; top: 0; right: -9px; width: 18px; height: 100%;
    background-image: radial-gradient(circle 9px at 9px 0, transparent 9px, var(--notch) 9.5px), radial-gradient(circle 9px at 9px 100%, transparent 9px, var(--notch) 9.5px), repeating-linear-gradient(180deg, var(--bg-elevated) 0 10px, transparent 10px 20px);
    background-size: 18px 100%, 18px 100%, 2px 20px; background-repeat: no-repeat, no-repeat, repeat-y; background-position: left, left, calc(50% - 1px) 4px;
  }
  .stub .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-gold); }
  /* OKTA(위) · BREAK(가운데)는 같은 세로쓰기 축에 올려 정렬을 맞춘다 */
  .stub .label, .stub .mark { writing-mode: vertical-rl; font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.18em; opacity: 0.85; }
  .stub .mark { opacity: 1; font-weight: 700; }

  .cabin { flex: 1; position: relative; padding: clamp(1.5rem, 3.6vw, 2.8rem); min-width: 0; display: flex; flex-direction: column; justify-content: safe center; align-items: safe center; gap: var(--gap-block); }
  .cabin .eyebrow { margin-bottom: 0.15rem; line-height: 1.2; }
  .cabin h2 { font-size: var(--fs-h2); line-height: var(--lh-tight); font-weight: 700; margin-bottom: 0.3rem; position: relative; }
  .cabin h2::after { content: ""; display: block; width: 36px; height: 3px; margin: 0.45rem auto; background: var(--accent-gold); }
  /* 내용이 많은 슬라이드 — 세로 가운데 정렬을 풀고 위에서부터 채운다.
     가운데 정렬은 내용이 화면보다 길어지면 아래쪽이 잘려나가서 못 쓴다. */
  .slide.dense .cabin { justify-content: flex-start; padding-top: clamp(0.8rem, 1.7vw, 1.3rem); padding-bottom: clamp(0.4rem, 0.9vw, 0.8rem); gap: 0.25rem; }
  .slide.dense .cabin h2 { margin-bottom: 0.1rem; }
  .slide.dense .cabin h2::after { margin: 0.25rem auto; }
  .slide.dense .cabin .eyebrow { margin-bottom: 0.05rem; }
  .slide.dense .lede { margin: 0.2rem 0 0; }

  .centered-header { text-align: center; }
  .centered-header h2::after { margin-left: auto; margin-right: auto; }
  .centered-header .lede { max-width: 640px; margin-left: auto; margin-right: auto; }
  .centered-block { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 62%; text-align: center; }
  .centered-block h2::after { margin-left: auto; margin-right: auto; }
  .centered-block .plain-list { text-align: left; display: inline-block; }
  .deadline-badge { margin-top: 1.6rem; display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-weight: 700; font-size: 1.35rem; color: var(--accent-red); background: color-mix(in srgb, var(--accent-red) 10%, transparent); border: 1.5px solid var(--accent-red); border-radius: 14px; padding: 0.7rem 1.6rem; }
  .deadline-badge-lg { font-size: clamp(1.6rem, 3.2vw, 2.4rem); padding: 1rem 2.2rem; border-radius: 18px; border-width: 2px; }
  .lede { color: var(--ink-muted); font-size: var(--fs-lede); line-height: var(--lh-body); max-width: 68ch; }

  /* 위젯 조작 버튼 — 사다리/휠/믹서/빙고가 전부 이 규칙을 공유한다 */
  .ladder-actions button, .wheel-actions button, .mixer-actions button, .bingo-actions button {
    font-family: var(--font-mono); font-size: var(--fs-btn); padding: 0.65rem 1.4rem; border-radius: 26px;
    border: 1px solid var(--accent-gold); background: var(--accent-gold); color: #ffffff; cursor: pointer; font-weight: 600;
  }
  .ladder-actions button.secondary, .wheel-actions button.secondary, .mixer-actions button.secondary, .bingo-actions button.secondary { background: none; color: var(--ink); border-color: var(--line); }
  .ladder-actions button:disabled, .wheel-actions button:disabled, .mixer-actions button:disabled, .bingo-actions button:disabled { opacity: 0.5; cursor: default; }
  .ladder-actions button:focus-visible, .wheel-actions button:focus-visible, .mixer-actions button:focus-visible, .bingo-actions button:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  /* ---------- Big statement (title-only slides, MC narrates the rest) ---------- */
  .big-statement { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60%; text-align: center; }
  .huge { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-huge); line-height: var(--lh-tight); color: var(--ink); text-wrap: balance; }

  /* ---------- Seating (slide 1) ---------- */
  .seating .ticket { flex-direction: column; align-items: center; justify-content: center; text-align: center; margin: 0.6rem 0; padding: 0.5rem 1.5rem 0.8rem; gap: 0.4rem; position: relative; overflow: hidden; background: var(--bg-elevated); }
  .seating .stub { display: none; }
  .seating h2 { color: var(--ink); font-size: var(--fs-h2); }
  .seating-fx-canvas, .seating-plane-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0.12; }
  .seating-plane-canvas { z-index: 2; opacity: 1; }
  .seating-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
  /* 좌석 슬라이드에선 도면이 남는 세로 공간을 전부 먹는다 (전체화면에서 커지고 창 모드에선 줄어든다) */
  .seating .ticket:has(.floorplan-frame) { justify-content: flex-start; }
  .seating-content:has(.floorplan-frame) { flex: 1; min-height: 0; width: 100%; }
  /* 연회장 평면도 — 원본 이미지 그대로(배경 포함, 크롭 없음). 가로/세로 중 남는 공간을 모두 써서 최대 크기로 표시(contain) */
  .floorplan-frame { flex: 1 1 auto; min-height: 0; width: 100%; overflow: hidden; }
  .floorplan-img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
  .seating .lede { max-width: 44ch; color: var(--ink-muted); }

  /* ---------- Overview (Day1/2/3 summary) ---------- */
  .overview-grid { margin-top: 0.4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; width: 100%; }
  @media (max-width: 760px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-grid h3 { font-size: 0.92rem; color: var(--accent-navy); margin-bottom: 0.4rem; font-family: var(--font-mono); letter-spacing: 0.03em; }
  .overview-grid .timeline .row { grid-template-columns: 3rem 1fr; padding: 0.35rem 0; }
  .overview-grid .timeline time { font-size: 0.78rem; }
  .overview-grid .timeline .desc { font-size: 0.82rem; line-height: 1.35; }

  /* ---------- 팀 구성 (10개 조 명단 한 장) ---------- */
  .roster-grid { margin-top: 0.6rem; width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
  @media (max-width: 1100px) { .roster-grid { grid-template-columns: repeat(3, 1fr); } }
  .roster-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 0.45rem 0.55rem; background: var(--bg-elevated); min-width: 0; }
  .roster-card .rteam { font-family: var(--font-mono); font-weight: 700; font-size: 1rem; color: var(--accent-gold); margin-bottom: 0.25rem; }
  .rmembers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.1rem; }
  .rmembers li { display: flex; align-items: baseline; gap: 0.35rem; line-height: 1.18; min-width: 0; }
  .rmembers .rname { font-size: 0.84rem; font-weight: 600; flex: none; }
  .rmembers .rorg { font-size: 0.62rem; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* ---------- 상권 비교분석표 (Mac 사양 비교 스타일) ---------- */
  .compare-scroll { margin-top: 0.9rem; width: 100%; overflow-x: auto; }
  .compare-table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 720px; }
  /* 셀 여백을 좁혀 사진에 세로 공간을 넘겨준다 */
  .compare-table th, .compare-table td { border-bottom: 1px solid var(--line); padding: 0.28rem 0.45rem; text-align: center; vertical-align: middle; }
  .compare-table thead th { border-bottom: 2px solid var(--accent-navy); vertical-align: bottom; }
  /* 행 제목 칸을 좁혀 5개 상권 칸을 넓힌다 (사진을 키우려면 가로 폭이 필요하다) */
  .compare-table .crow-head { width: 7rem; text-align: left; font-size: 1.05rem; font-weight: 700; color: var(--accent-navy); background: color-mix(in srgb, var(--accent-navy) 4%, transparent); }
  .compare-table tbody td { font-family: var(--font-mono); font-size: 1.05rem; color: var(--ink-muted); }
  /* 대표사진 — 118px → 216px (약 1.8배). 216px 가 칸 사이 여백을 남기는 최대치 */
  .cthumb { width: clamp(78px, 14vw, 216px); aspect-ratio: 1; margin: 0 auto 0.25rem; border-radius: 10px; border: 1.5px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 5%, var(--bg-elevated)); overflow: hidden; }
  .cthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 5개 상권 이름을 전부 한 줄로 — 마리나베이샌즈만 2줄로 접혀 사진 줄이 어긋나던 문제 */
  .compare-table .cname { font-size: 0.95rem; font-weight: 700; line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 긴 서술형 셀 — 가운데 정렬하면 읽기 나쁘므로 왼쪽 정렬 + 줄바꿈 허용 */
  .compare-table td.cell-l { text-align: left; font-family: var(--font-body); white-space: normal; word-break: keep-all; }
  /* 제공정보 4행 표 — 사진을 줄이고 셀을 본문 폰트로 바꿔 4행이 전부 들어가게 한다.
     (.compare-scroll 은 overflow-x:auto 라 세로도 auto 가 되어, 넘치면 조용히 잘린다) */
  .compare-table.brief .cthumb { width: clamp(60px, 6.4vw, 94px); }
  .compare-table.brief tbody td { font-family: var(--font-body); font-size: 0.84rem; white-space: normal; word-break: keep-all; line-height: 1.28; color: var(--ink); }
  .compare-table.brief .crow-head { font-size: 0.92rem; }
  .compare-table.brief th, .compare-table.brief td { padding: 0.22rem 0.4rem; }
  /* 배정 상권 표 — '주요 특징'·'주요 고객층' 머리글을 '상권'과 같은 크기로 맞춘다 */
  .compare-table.traits thead th { font-size: 1.05rem; font-weight: 700; color: var(--accent-navy); vertical-align: middle; }
  /* 투자 집계 · 시상 — 시상 2종을 이름/설명 두 줄로 */
  .award-row { margin-top: 0.55rem; display: flex; flex-direction: column; gap: 0.1rem; }
  .award-name { font-weight: 700; font-size: 1.02rem; color: var(--accent-gold); }
  .award-desc { font-size: 0.88rem; color: var(--ink-muted); }
  /* 어느 범위의 시상인지 구분하는 작은 꼬리표 (샤크탱크 한정 / 행사 전체) */
  .scope-tag { margin-left: 0.4rem; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-navy); background: color-mix(in srgb, var(--accent-navy) 12%, transparent); border-radius: 20px; padding: 0.12rem 0.5rem; vertical-align: middle; }
  /* 투자 집계 · 시상 슬라이드만 글씨를 키운다 (.field-card 를 쓰는 다른 슬라이드는 건드리지 않는다) */
  .field-grid.tally { gap: 1.2rem; align-items: start; }
  .field-grid.tally .field-card { padding: 1.4rem 1.6rem; }
  .field-grid.tally .fname { font-size: 1.65rem; margin-bottom: 0.6rem; }
  .field-grid.tally .fsub { font-size: 1.15rem; line-height: var(--lh-body); }
  .field-grid.tally .plain-list { font-size: 1.3rem; line-height: 1.85; margin-top: 0.7rem; }
  .field-grid.tally .award-row { margin-top: 1rem; }
  .field-grid.tally .award-name { font-size: 1.45rem; }
  .field-grid.tally .award-desc { font-size: 1.12rem; margin-top: 0.15rem; }
  .field-grid.tally .scope-tag { font-size: 0.82rem; padding: 0.18rem 0.6rem; }

  /* ---------- Timeline ---------- */
  .timeline { margin-top: 0.3rem; display: flex; flex-direction: column; }
  .timeline .row { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0.9rem; padding: 0.4rem 0; border-bottom: 1px solid var(--line); }
  .timeline .row:last-child { border-bottom: none; }
  .timeline .row.dim { opacity: 0.55; }
  .timeline time { font-family: var(--font-mono); font-size: 0.98rem; color: var(--accent-gold); font-variant-numeric: tabular-nums; text-align: center; }
  .timeline .desc { font-size: var(--fs-body); line-height: var(--lh-tight); text-align: left; }
  .timeline .desc small { display: block; color: var(--ink-muted); font-size: 0.9rem; margin-top: 0.15rem; }

  /* ---------- Team placeholder slides ---------- */

  /* ---------- Speakers ---------- */
  .speaker-grid { margin-top: 0.4rem; display: flex; min-height: 50vh; }
  .speaker-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0.7rem; padding: 1.5rem 1.2rem; border-right: 1px solid var(--line); }
  .speaker-card:last-child { border-right: none; }
  .speaker-card .avatar { width: clamp(140px, 14vw, 195px); height: clamp(140px, 14vw, 195px); font-size: 2.6rem; }
  .speaker-card .name { font-weight: 700; font-size: 1.6rem; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); color: var(--accent-gold); font-size: 0.92rem; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .speaker-card .role, .speaker-card .topic { font-size: 1.05rem; color: var(--ink-muted); }
  .speaker-card .stime { font-family: var(--font-mono); font-size: var(--fs-mono-sm); color: var(--ink-muted); }
  .speaker-card .topic { color: var(--ink); }

  .exec-grid { margin-top: 0.6rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2rem; min-height: 62vh; }
  .exec-row { display: flex; justify-content: center; gap: 4.5rem; }
  .exec-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem; }
  .exec-avatar { width: 150px; height: 150px; font-size: 1.3rem; }
  .exec-card .name { font-weight: 700; font-size: 1.8rem; }
  .exec-card .role { font-size: 1.25rem; color: var(--ink-muted); }

  /* ---------- MC intro card (speaker / judge, read before they come up) ---------- */
  .mc-card { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; margin-top: 0.6rem; }
  .mc-photo-slot { flex: none; width: clamp(150px, 22vw, 220px); height: clamp(150px, 22vw, 220px); border-radius: 50%; border: 2px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.8rem; text-align: center; overflow: hidden; }
  .mc-photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .mc-card .name { font-size: 1.4rem; font-weight: 700; }
  .mc-card .role { color: var(--ink-muted); font-size: 1rem; margin-top: 0.2rem; }

  /* ---------- Speaker detail (career list) ---------- */
  .speaker-detail-head { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; }
  /* 연혁 40% 확대 후 5줄짜리(한재경) 슬라이드가 넘쳐서 사진 상한을 260 → 224px 로 낮춤 */
  .speaker-photo-slot { flex: none; width: clamp(150px, min(19vw, 21vh), 224px); height: clamp(150px, min(19vw, 21vh), 224px); border-radius: 50%; border: 2px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.82rem; text-align: center; overflow: hidden; }
  .speaker-photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  /* 발표자료가 들어온 강연자만 사진이 링크가 된다 */
  a.speaker-photo-slot, .speaker-photo-slot.gold-border { border-style: solid; border-color: var(--accent-gold); }
  a.speaker-photo-slot { text-decoration: none; cursor: pointer; position: relative; transition: transform 0.18s ease, box-shadow 0.18s ease; }
  a.speaker-photo-slot:hover { transform: scale(1.02); box-shadow: var(--shadow); }
  a.speaker-photo-slot:focus-visible { outline: 3px solid var(--accent-gold); outline-offset: 3px; }

  .speaker-org-badge { display: inline-block; align-self: flex-start; background: var(--accent-navy-deep); color: #eef1f6; font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em; padding: 0.25rem 0.7rem; border-radius: 20px; margin-bottom: 0.35rem; }
  .speaker-detail-head .name { font-size: 1.5rem; font-weight: 700; }
  .speaker-detail-head .topic { color: var(--accent-navy); font-size: 1.05rem; font-weight: 600; margin-top: 0.25rem; }
  .career-list { margin-top: 0.45rem; display: flex; flex-direction: column; gap: 0.25rem; width: 100%; }
  .career-list .row { display: grid; grid-template-columns: 11.9rem 1fr; gap: 0.7rem; padding: 0.2rem 0; border-bottom: 1px solid var(--line); }
  .career-list .row:last-child { border-bottom: none; }
  .career-list .yr { font-family: var(--font-mono); font-size: 1.23rem; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
  .career-list .desc { font-size: calc(var(--fs-body) * 1.4); line-height: var(--lh-tight); }
  @media (max-width: 560px) {
    .speaker-detail-head, .mc-card { flex-direction: column; align-items: flex-start; text-align: left; }
    .career-list .row { grid-template-columns: 1fr; gap: 0.15rem; }
  }

  /* ---------- Insert placeholder ---------- */
  /* 조당 배정 시간 — 무대 뒤에서도 읽히도록 최대 크기 */
  .timebox { margin-top: 1.4rem; display: flex; align-items: center; justify-content: center; gap: clamp(1.2rem, 4vw, 3.2rem); flex-wrap: wrap; }
  .timebox-row { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
  .timebox .tb-num { font-family: var(--font-display); font-weight: 800; font-size: min(clamp(2.8rem, 7.5vw, 5.6rem), 120px); line-height: 1; color: var(--accent-gold); }
  .timebox .tb-label { font-family: var(--font-mono); font-size: clamp(1.2rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: 0.08em; color: var(--ink); }
  .timebox-plus { font-family: var(--font-display); font-weight: 800; font-size: min(clamp(2.4rem, 6vw, 4.5rem), 120px); color: var(--ink-muted); }

  .insert-box { margin-top: 1.1rem; border: 1.5px dashed var(--line); border-radius: 12px; padding: 1.6rem; text-align: center; color: var(--ink-muted); background: color-mix(in srgb, var(--accent-gold) 6%, var(--bg-elevated)); font-size: 1.05rem; min-height: 110px; display: flex; align-items: center; justify-content: center; }

  .photo-grid-lg { margin-top: 1.2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; }
  @media (max-width: 620px) { .photo-grid-lg { grid-template-columns: 1fr; } }
  /* 카드 밖으로 넘치지 않도록 높이를 제한 — 남는 폭은 흐린 배경이 채운다 */
  .photo-slot-lg { aspect-ratio: 4 / 3; min-height: 160px; max-height: 42vh; border: 1.5px dashed var(--line); border-radius: 12px; background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.92rem; overflow: hidden; position: relative; }
  .photo-slot-lg.has-img { border-style: solid; padding: 0; }
  /* 세로 사진도 잘리지 않게 전체를 보여주고, 남는 여백은 같은 사진을 흐리게 깔아 채운다 */
  .photo-slot-lg.has-img img { width: 100%; height: 100%; object-fit: contain; display: block; position: relative; z-index: 1; }
  .photo-slot-lg.has-img img.photo-bg { position: absolute; inset: 0; z-index: 0; object-fit: cover; transform: scale(1.15); filter: blur(18px) brightness(0.72); }
  .photo-slot-lg.has-img span { position: absolute; z-index: 2; left: 0.6rem; bottom: 0.5rem; padding: 0.15rem 0.55rem; border-radius: 6px; background: rgba(0, 0, 0, 0.55); color: #eef1f6; font-size: 0.76rem; }

  /* ---------- Shark Tank locations ---------- */
  .loc-grid { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; width: 100%; }
  @media (max-width: 560px) { .loc-grid { grid-template-columns: 1fr; } }
  .loc-card { border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; background: color-mix(in srgb, var(--accent-navy) 5%, var(--bg-elevated)); }
  .loc-card .loc-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.15rem; }
  .loc-card .loc-biz { font-size: 0.9rem; color: var(--accent-gold); font-family: var(--font-mono); margin-bottom: 0.5rem; }
  .loc-dl { margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem 1rem; font-size: 0.84rem; }
  .loc-dl-lg { font-size: var(--fs-body); margin-top: 0.6rem; }
  @media (max-width: 420px) { .loc-dl { grid-template-columns: 1fr; } }
  .loc-dl dt { color: var(--ink-muted); }
  .loc-dl dd { margin: 0.15rem 0 0; }
  .loc-field { min-width: 0; }
  .tags { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.03em; padding: 0.15rem 0.45rem; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-muted); }
  .prize-badges { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .prize-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-weight: 700; font-size: 1.05rem; padding: 0.5rem 1.1rem; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg-elevated); }
  .prize-badge .medal { font-size: 1.25rem; }
  .prize-badge.gold { border-color: #d4af37; color: #d4af37; }
  .prize-badge.silver { border-color: #a8a9ad; color: #a8a9ad; }
  .prize-badge.bronze { border-color: #cd7f32; color: #cd7f32; }
  .prize-badges-lg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; width: 100%; }
  .prize-badges-lg .prize-badge { font-size: clamp(1.6rem, 3.4vw, 2.4rem); padding: 1rem 2rem; border-radius: 20px; border-width: 2px; background: var(--bg-elevated); width: 100%; justify-content: center; }
  .prize-badges-lg .prize-badge .medal { font-size: 1.35em; }
  .prize-badges-lg .prize-badge.gold { border-color: #d4af37; color: #a07c10; }
  .prize-badges-lg .prize-badge.silver { border-color: #a8a9ad; color: #5f5f5f; }
  .prize-badges-lg .prize-badge.bronze { border-color: #cd7f32; color: #7a4810; }

  /* ---------- 순위 발표 시상대 ----------
     칸(2등 왼쪽 · 1등 중앙 · 3등 오른쪽)은 처음부터 전부 보인다.
     Enter 를 누르면 3등 → 2등 → 1등 순서로 그 칸의 조 이름만 채워진다. */
  .rank-podium { margin-top: 0.7rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; align-items: end; width: min(1180px, 100%); align-self: center; }
  .podium-card { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.5rem; padding: 1.3rem 1.1rem; border-radius: 20px; border: 2px solid var(--line); background: var(--bg-elevated); }
  .podium-card.gold { border-color: #d4af37; min-height: 17rem; }
  .podium-card.silver { border-color: #a8a9ad; min-height: 14rem; }
  .podium-card.bronze { border-color: #cd7f32; min-height: 11.5rem; }
  .podium-card .medal { font-size: 2.9rem; line-height: 1; }
  .podium-card.gold .medal { font-size: 3.6rem; }
  .podium-card .rank-label { font-family: var(--font-mono); font-weight: 700; font-size: 1.9rem; }
  .podium-card.gold .rank-label { font-size: 2.35rem; }
  /* 조 이름 자리 — 비어 있어도 점선으로 자리를 지킨다 (공개 시 레이아웃이 흔들리지 않게) */
  .podium-team { width: 100%; min-height: 3.2rem; display: flex; align-items: center; justify-content: center; border-bottom: 2px dashed var(--line); transition: border-color 0.45s ease; }
  .podium-team.revealed { border-bottom-color: var(--accent-gold); }
  .podium-team .tname { font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: var(--accent-gold); opacity: 0; transform: translateY(12px); transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1); }
  .podium-card.gold .podium-team .tname { font-size: 2.5rem; }
  /* 조 이름이 아직 안 정해졌을 때 뜨는 자리표시 텍스트 — 실제 조 이름과 구분되게 회색 */
  .podium-team .tname.placeholder { color: var(--ink-muted); }
  .podium-team.revealed .tname { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .podium-team, .podium-team .tname { transition: none; } }
  @media (max-width: 700px) { .rank-podium { grid-template-columns: 1fr; align-items: stretch; } .podium-card.gold, .podium-card.silver, .podium-card.bronze { min-height: 0; } }

  /* ---------- 채점표 ---------- */
  .score-grid { margin-top: 1rem; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  @media (max-width: 900px) { .score-grid { grid-template-columns: 1fr; } }
  .score-card { border: 1.5px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; background: var(--bg-elevated); }
  .sc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; padding-bottom: 0.5rem; margin-bottom: 0.5rem; border-bottom: 2px solid var(--accent-navy); }
  .sc-head .sc-name { font-weight: 700; font-size: 1.1rem; }
  .sc-head .sc-total { font-family: var(--font-mono); font-weight: 700; color: var(--accent-gold); }
  .sc-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .sc-items li { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8rem; font-size: 0.95rem; line-height: var(--lh-tight); }
  .sc-items li b { font-family: var(--font-mono); color: var(--accent-navy); flex: none; }
  .score-sum { margin-top: 1rem; font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700; text-align: center; }
  .score-sum b { color: var(--accent-gold); font-size: 1.6rem; }

  /* 점수표 — 10개 조 전체를 한 화면에 담기 위한 5열 촘촘 버전 */
  .score-grid.wide { grid-template-columns: repeat(5, 1fr); gap: 0.6rem; margin-top: 0.5rem; }
  .score-grid.wide .score-card { padding: 0.55rem 0.65rem; border-radius: 10px; }
  .score-grid.wide .sc-head { padding-bottom: 0.3rem; margin-bottom: 0.3rem; }
  .score-grid.wide .sc-head .sc-name { font-size: 0.92rem; }
  .score-grid.wide .sc-head .sc-total { font-size: 0.8rem; }
  .score-grid.wide .sc-items { gap: 0.2rem; }
  .score-grid.wide .sc-items li { font-size: 0.74rem; }

  /* ---------- Route / movement map ---------- */
  .route-map { margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 1.4rem; flex-wrap: wrap; min-height: 55%; }
  .route-stop { border: 2px solid var(--accent-navy); border-radius: 18px; padding: 2rem 1.8rem; font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; background: var(--bg-elevated); text-align: center; color: var(--ink); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 0.6rem; min-width: 170px; }
  .route-stop .ricon { font-size: 1rem; font-weight: 400; letter-spacing: 0.1em; color: var(--accent-gold); font-family: var(--font-mono); text-transform: uppercase; }
  .route-arrow { color: var(--accent-gold); font-size: 2.4rem; font-weight: 700; }
  @media (max-width: 700px) { .route-map { gap: 0.8rem; } .route-stop { padding: 1.2rem 1rem; font-size: 1.05rem; min-width: 120px; } .route-arrow { font-size: 1.6rem; } }

  .plain-list { margin: 0; padding-left: 1.1rem; font-size: var(--fs-body); line-height: var(--lh-body); }
  /* GCC 3단계 — 본문 톤(non-bold), 기존 대비 60% 크기 */
  .gcc-steps { font-size: clamp(0.96rem, 2.04vw, 1.56rem); font-weight: 400; line-height: 1.9; font-variant-numeric: tabular-nums; }
  .gcc-steps::marker, .gcc-steps li::marker { color: var(--accent-gold); }
  .bingo-rules { font-size: clamp(1.05rem, 1.9vw, 1.5rem); line-height: 1.75; max-width: 62ch; }
  .bingo-rules li::marker { color: var(--accent-gold); font-weight: 700; }
  .bingo-rules b { color: var(--accent-navy); }
  /* 규칙 목록과 한 블록으로 묶어 왼쪽 끝을 맞춘다 (글자 크기가 달라 62ch 폭이 서로 다르기 때문) */
  .bingo-rules-block { display: flex; flex-direction: column; align-items: flex-start; }
  .bingo-rules-note { margin-top: 1.1rem; text-align: left; max-width: 62ch; }
  .plain-list.ordered { padding-left: 1.3rem; }

  /* ---------- Day divider ---------- */
  .divider .ticket { align-items: stretch; }
  .divider .cabin { display: flex; flex-direction: column; justify-content: center; gap: 0.7rem; padding-block: clamp(0.8rem, 1.6vw, 1.2rem); }
  .divider .daynum { font-family: var(--font-mono); font-size: clamp(2.8rem, 7.2vw, 4.2rem); font-weight: 700; color: var(--accent-gold); line-height: 1; }
  .divider .datestr { font-family: var(--font-mono); font-size: 1.12rem; color: var(--ink-muted); letter-spacing: 0.04em; }
  .divider .mini-agenda { margin-top: 0.2rem; }
  .divider .mini-agenda .row { grid-template-columns: 3.6rem 1fr; padding: 0.3rem 0; }

  /* ---------- Break slide ---------- */
  /* stretch 유지 — center 로 두면 왼쪽 파란 스텁이 내용 높이로 줄어들어 'OKTA'/'BREAK' 가 붙어 보인다 */
  .break .ticket { align-items: stretch; justify-content: center; text-align: center; }
  .break .cabin { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; min-height: 0; }
  .break h2 { font-size: var(--fs-h2-lg); line-height: var(--lh-tight); color: var(--ink); }
  .break .duration { font-family: var(--font-mono); font-size: min(clamp(3.4rem, 9.5vw, 5.2rem), 120px); font-weight: 700; color: var(--accent-navy); letter-spacing: 0.02em; }
  .break .next-up { margin-top: 0.3rem; padding-top: 0.9rem; border-top: 1px solid var(--line); font-size: 1.8rem; line-height: 1.5; color: var(--ink-muted); }
  .break .next-up b { color: var(--ink); }

  /* ---------- Ladder draw widget ---------- */
  .ladder-wrap { margin-top: 0.2rem; display: flex; flex-direction: column; gap: 0.35rem; align-items: center; width: 100%; }
  .ladder-track-box { max-width: 100%; overflow-x: auto; }
  .ladder-row { position: relative; height: 56px; }
  [data-ladder-results] { height: auto; min-height: 92px; }
  .ladder-chip { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-mono); }
  /* 조 이름표는 드래그 전용 — 끌어서 순서를 재배열한다 */
  .ladder-chip.name { padding: 11px 20px; border-radius: 24px; border: 1.5px solid var(--line); background: var(--bg-elevated); color: var(--ink); font-size: 28px; font-weight: 700; cursor: grab; touch-action: none; user-select: none; transition: left 0.18s ease, border-color 0.15s ease, color 0.15s ease; }
  .ladder-chip.name:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
  .ladder-chip.name.dragging { transition: none; cursor: grabbing; z-index: 5; border-color: var(--accent-gold); color: var(--accent-gold); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28); }
  .ladder-chip.name:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .ladder-chip.name { transition: none; } }
  .ladder-chip.result { padding: 9px 6px; border-radius: 16px; background: color-mix(in srgb, var(--accent-navy) 8%, transparent); color: var(--ink-muted); font-size: 22px; font-weight: 700; text-align: center; cursor: default; white-space: normal; width: var(--result-w, 116px); line-height: 1.2; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease; }
  .ladder-chip.result.hit { color: var(--hit-color, var(--accent-gold)); background: color-mix(in srgb, var(--hit-color, var(--accent-gold)) 16%, transparent); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--hit-color, var(--accent-gold)) 50%, transparent); transform: translateX(-50%) scale(1.1); }
  .ladder-actions { display: flex; gap: 0.7rem; }
  /* 결과 요약이 생기면서 토스트는 없앴다 — 아래 .ladder-summary 가 결과를 직접 보여준다 */
  /* 사다리 결과 요약 — 장소별로 어느 조가 갔는지 한눈에 (선을 따라가지 않아도 읽힌다) */
  .ladder-summary { margin-top: 0.7rem; width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.6rem; opacity: 0; transition: opacity 0.4s ease; }
  .ladder-summary.show { opacity: 1; }
  .ls-card { border: 1.5px solid var(--line); border-radius: 12px; padding: 0.55rem 0.6rem; text-align: center; background: var(--bg-elevated); min-width: 0; }
  .ls-loc { font-size: 0.92rem; font-weight: 700; color: var(--accent-navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ls-teams { margin-top: 0.25rem; font-family: var(--font-mono); font-weight: 700; font-size: 1.2rem; color: var(--accent-gold); }
  @media (prefers-reduced-motion: reduce) { .ladder-summary { transition: none; } }

  /* ---------- Spin wheel widget (left: cumulative order list, right: wheel + latest result) ---------- */
  .wheel-wrap { margin-top: 0.1rem; flex: 1; width: 100%; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 0; transition: gap 0.8s ease; }
  .wheel-wrap.revealed { gap: 2.6rem; }
  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; flex: none; }
  /* 10개 조가 다 뽑히면 왼쪽 순서 목록이 10줄이 된다 — 그때도 안 잘리는 크기 */
  .wheel-stage { position: relative; width: min(49.5vh, 45vw); height: min(49.5vh, 45vw); min-width: 330px; min-height: 330px; }
  .wheel-disc { width: 100%; height: 100%; border-radius: 50%; transition: transform 4.6s cubic-bezier(0.12, 0.72, 0.15, 1); }
  .wheel-disc canvas { display: block; width: 100%; height: 100%; border-radius: 50%; }
  @media (prefers-reduced-motion: reduce) { .wheel-disc { transition: none; } }

/* ===================== 슬라이드 렌더러 ===================== */

function timeline(rows) {
  return `<div class="timeline">${rows.map(r => `<div class="row${r[2] ? ' dim' : ''}"><time>${r[0]}</time><div class="desc">${r[1]}</div></div>`).join('')}</div>`;
}

// 임원 소개 — 2명·3명 두 줄로 가운데 정렬.
// 현재 임원 슬라이드는 제목만 띄우고 MC가 구두로 소개하므로 이 함수는 어느 슬라이드에서도 호출하지 않는다.
// 명단·사진이 확정되면 임원 슬라이드 body 에 ${executiveGrid()} 를 다시 넣어 쓴다 — 그때까지 의도적으로 남겨둔 코드.
function executiveGrid() {
  const rows = [EXECUTIVES.slice(0, 2), EXECUTIVES.slice(2)];
  return `<div class="exec-grid">${rows.map(row => `<div class="exec-row">${row.map(e => `
    <div class="exec-card">
      <div class="avatar exec-avatar">${e.photo ? `<img src="${e.photo}" alt="${e.name}">` : '사진'}</div>
      <div class="name">${e.name}</div>
      <div class="role">${e.role}</div>
    </div>`).join('')}</div>`).join('')}</div>`;
}

function speakerGrid() {
  return `<div class="speaker-grid">${SPEAKERS.map(s => `
    <div class="speaker-card">
      <div class="avatar">${s.photo ? `<img src="${s.photo}" alt="${s.name}">` : s.name[0]}</div>
      <div class="name">${s.name}</div>
      <div class="role">${s.role}</div>
      <div class="topic">${s.topic}</div>
      <div class="stime">${s.time}</div>
    </div>`).join('')}</div>`;
}

function locationGrid() {
  return `<div class="loc-grid">${LOCATIONS.map(l => `
    <div class="loc-card">
      <div class="loc-name">${l.no} ${l.name}</div>
      <dl class="loc-dl">
        <div class="loc-field"><dt>스퀘어핏당 부동산 가격</dt><dd>${l.pricePerSqft || 'TBD (추후 업데이트)'}</dd></div>
      </dl>
    </div>`).join('')}</div>`;
}


// 사진 삽입 슬롯 — src 가 있으면 배경 블러 + 원본, 없으면 점선 플레이스홀더.
// 로케이션 개별 슬라이드(무스타파·MBS·맥스웰·하지레인·부기스)를 걷어내면서 현재 호출부가 없다.
// 상권 사진 페이지를 다시 넣게 되면 그대로 재사용 — 그때까지 의도적으로 남겨둔 코드.
function photoSlot(src, alt, caption) {
  return src
    ? `<div class="photo-slot-lg has-img"><img class="photo-bg" src="${src}" alt="" aria-hidden="true"><img src="${src}" alt="${alt}"><span>${caption}</span></div>`
    : `<div class="photo-slot-lg"><span>${caption} 삽입 영역</span></div>`;
}

function speakerSlide(i) {
  const s = SPEAKERS[i];
  const d = SPEAKER_DETAILS[i];
  return `
    <div class="eyebrow">Special Lecture · ${s.time}</div>
    <h2>특강 — ${s.name}</h2>
    <div class="speaker-detail-head">
      ${/* 사진을 누르면 로컬 발표자료(pptx)가 열린다. 자료 미도착이면 링크 없이 사진만. */ ''}
      ${d.deck
        ? `<a class="speaker-photo-slot has-deck" href="${encodeURI(d.deck)}" title="${d.name} 강연 자료 열기">
             ${d.photo ? `<img src="${d.photo}" alt="${d.name}">` : `<span>강연자 사진<br>삽입 예정</span>`}
           </a>`
        : `<div class="speaker-photo-slot gold-border">${d.photo ? `<img src="${d.photo}" alt="${d.name}">` : `<span>강연자 사진<br>삽입 예정</span>`}</div>`}
      <div>
        <span class="speaker-org-badge">${d.org}</span>
        <div class="name">${d.name}</div>
        <div class="topic">${d.topic}</div>
      </div>
    </div>
    <div class="career-list">${d.career.map(([yr, desc]) => `<div class="row"><div class="yr">${yr}</div><div class="desc">${desc}</div></div>`).join('')}</div>
  `;
}

// MC 소개 카드 — 무대에 오르기 전 MC가 읽는 이름/직함/소속 카드 (심사위원, 축사자 공용)
function mcCard(p) {
  return `
    <div class="mc-card">
      <div class="mc-photo-slot">${p.photo ? `<img src="${p.photo}" alt="${p.name}">` : `<span>사진<br>삽입 예정</span>`}</div>
      <div>
        <div class="name">${p.name}</div>
        <div class="role">${p.role}${p.org ? ' · ' + p.org : ''}</div>
      </div>
    </div>`;
}

// 브레이크 슬라이드 — 제목(중식/휴식/개인정비)을 큰 글씨 하나로만 찍는다.
// 예전에는 같은 단어를 갈색 eyebrow + 검은 h2 로 두 번 찍어 겹쳐 보였다.
// 다음 순서는 항상 3줄 — 라벨 / 사람(이름·소속) / 주제. 사람이 없는 순서면 그 줄은 건너뛴다.
function breakSlide(title, duration, nextLabel, nextWho, nextDesc) {
  return `
    <h2>${title}</h2>
    ${duration ? `<div class="duration">${duration}</div>` : ''}
    ${nextLabel ? `<div class="next-up">다음 순서 · <b>${nextLabel}</b>${nextWho ? `<br>${nextWho}` : ''}${nextDesc ? `<br>${nextDesc}` : ''}</div>` : ''}
  `;
}

function dayDivider(num, dateStr, items) {
  return `
    <div class="daynum">DAY ${num}</div>
    <div class="datestr">${dateStr}</div>
    <div class="mini-agenda">${timeline(items)}</div>
  `;
}

// 통상 색깔 범례 한 칸 — 색 견본 + 통상 번호 + 실제 테이블 번호
function mixerLegend(g) {
  return `
    <div class="mm-item">
      <span class="mm-dot" style="background:${g.color}"></span>
      <span class="mm-text">
        <b>${g.label}</b>
        <small>${g.tables.map(t => `${t}번 테이블`).join(' · ')}</small>
      </span>

}

// 원하는 분야 네트워킹 — 도면 좌/우 컬럼에 들어가는 분야 범례 한 칸 (색은 GCC_GROUPS, 도면과 1:1)

}

function teamSlide(n) {

    <div class="big-statement"><div class="huge">${n}조 자기소개</div></div>

/* Hero 로고 위치 재계산 — .hero .ticket 는 object-fit:cover 로 화면을 꽉 채우므로,
   화면 비율이 원본 이미지(2752x1536)와 다르면 상하 또는 좌우가 잘린다. 로고를 "이미지 속 같은 지점"
   (멀라이언 갈기 끝을 피한 자리)에 고정하려면 잘려나간 비율만큼 화면 기준 좌표를 다시 계산해야 한다. */
function positionHeroLogo() {
  const ticket = document.querySelector('.hero .ticket');
  const logo = document.querySelector('.hero-logo');
  if (!ticket || !logo) return;
  const { width, height } = ticket.getBoundingClientRect();
  if (!width || !height) return;
  const IMG_W = 2752, IMG_H = 1536;
  const containerAR = width / height;
  const imageAR = IMG_W / IMG_H;
  const TARGET_TOP = 11.65, TARGET_RIGHT = 9, TARGET_WIDTH = 17; // 이미지 원본 기준 %
  let visW = 100, visH = 100, offX = 0, offY = 0; // 화면에 보이는 이미지 비율(%)과 잘려나간 여백(%)
  if (containerAR > imageAR) {
    // 화면이 이미지보다 넓다 → 상하가 잘려나간다
    visH = (imageAR / containerAR) * 100;
    offY = (100 - visH) / 2;
  } else {
    // 화면이 이미지보다 좁다(또는 같다) → 좌우가 잘려나간다
    visW = (containerAR / imageAR) * 100;
    offX = (100 - visW) / 2;
  }
  // 화면비가 극단적이면(초광각 등) 목표 지점 자체가 크롭 영역 밖으로 밀려날 수 있으므로,
  // 로고가 화면 밖으로 사라지지 않도록 코너 쪽으로 값을 clamp 한다.
  logo.style.top = Math.min(Math.max((TARGET_TOP - offY) / visH * 100, 1.5), 35) + '%';
  logo.style.right = Math.min(Math.max((TARGET_RIGHT - offX) / visW * 100, 1.5), 35) + '%';
  logo.style.width = Math.min(Math.max(TARGET_WIDTH / visW * 100, 10), 28) + '%';
}
window.addEventListener('resize', positionHeroLogo);
['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach((evt) => {
  document.addEventListener(evt, positionHeroLogo);
});

function escapeHtml(str) {

}

    if (heading) {

      clone.querySelectorAll('br').forEach((br) => br.replaceWith(' '));
      title = clone.textContent.replace(/\s+/g, ' ').trim();

  }
  return `<option value="${i}">${String(i + 1).padStart(2, '0')} · ${escapeHtml(title)}</option>`;
}).join('');

let idx = 0;
function go(i) {
  const prev = idx;
  idx = Math.max(0, Math.min(slides.length - 1, i));
  // 순위 발표에서 벗어나면 공개 상태를 되돌린다 (다시 들어오면 3등부터)
  if (prev !== idx) resetRankReveal(slides[prev]);
  track.style.transform = `translateX(-${idx * 100}%)`;
  counter.value = String(idx);
  dots.forEach((d, i2) => d.classList.toggle('active', i2 === idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === slides.length - 1;
}

/* ---------------- 순위 발표 — Enter 로 3등 → 2등 → 1등 순차 공개 ----------------
   data-rank-step 이 작은 순서(3등=1)부터 열린다. 남은 등수가 없으면 false 를
   돌려줘서 Enter 가 평소대로 흘러가게 둔다. */
function revealNextRank(section) {
  if (!section) return false;
  const table = section.querySelector('[data-rank-reveal]');
  if (!table) return false;
  const next = Array.from(table.querySelectorAll('[data-rank-step]'))
    .filter((row) => !row.classList.contains('revealed'))
    .sort((a, b) => Number(a.dataset.rankStep) - Number(b.dataset.rankStep))[0];
  if (!next) return false;
  next.classList.add('revealed');
  return true;
}

// 슬라이드를 벗어났다가 돌아오면 처음부터 다시 공개할 수 있게 되돌린다
function resetRankReveal(section) {
  const table = section && section.querySelector('[data-rank-reveal]');
  if (!table) return;
  table.querySelectorAll('[data-rank-step]').forEach((row) => row.classList.remove('revealed'));
}

let currentSfxKey = null;

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  // 순위 발표 슬라이드가 열려 있고 아직 공개할 등수가 남았으면 Enter 를 여기서 소비한다
  if (e.key === 'Enter' && revealNextRank(slides[idx])) { e.preventDefault(); return; }
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === ' ') { e.preventDefault(); go(idx + 1); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'r' || e.key === 'R') resetActiveLadder();
  if (e.key === 'p' || e.key === 'P') triggerSeatingFlight();
  // B — 지금 보이는 슬라이드에 빙고 위젯이 있을 때만 BINGO! 오버레이
  if (e.key === 'b' || e.key === 'B') {
    const shout = slides[idx] && slides[idx].querySelector('[data-bingo-shout]');
    if (shout) shout.click();
  }
  const sfx = SFX_FILES.find((s) => s.key === e.key.toLowerCase());
  if (sfx) {
    if (currentSfxAudio) { currentSfxAudio.pause(); currentSfxAudio.currentTime = 0; currentSfxAudio = null; }
    if (currentSfxKey === sfx.key) {
      currentSfxKey = null;
    } else {
      currentSfxAudio = new Audio(encodeURI(sfx.src));
      currentSfxAudio.addEventListener('ended', () => { currentSfxAudio = null; currentSfxKey = null; });
      currentSfxAudio.play().catch(() => {});
      currentSfxKey = sfx.key;
    }
  }
});
go(0);

function currentFullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;

  if (!currentFullscreenElement()) {

  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    exit?.call(document).catch?.(() => {});
  }
}
