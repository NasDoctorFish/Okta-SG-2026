<title>2026 아세안 차세대 글로벌 창업무역스쿨 — 싱가포르</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f0f2f5;
    --bg-elevated: #ffffff;
    --ink: #1d233b;
    --ink-muted: #5f5f5f;
    --accent-gold: #c8940f;
    --accent-navy: #145a9f;
    --accent-navy-deep: #002d6c;
    --accent-red: #ae2329;
    --accent-green: #1f7a4d;
    --line: rgba(29, 35, 59, 0.14);
    --notch: var(--bg);
    --shadow: 0 24px 70px -34px rgba(29, 35, 59, 0.45);

    --font-display: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-body: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "IBM Plex Mono", "Roboto Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --bg-elevated: #141d33;
      --ink: #eef1f6;
      --ink-muted: #9aa5bd;
      --accent-gold: #eead1f;
      --accent-navy: #4f8fd1;
      --accent-navy-deep: #06132a;
      --accent-red: #d97a63;
      --accent-green: #4fd18f;
      --line: rgba(238, 241, 246, 0.16);
      --notch: var(--bg);
      --shadow: 0 24px 70px -34px rgba(0, 0, 0, 0.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --bg-elevated: #141d33; --ink: #eef1f6; --ink-muted: #9aa5bd;
    --accent-gold: #eead1f; --accent-navy: #4f8fd1; --accent-navy-deep: #06132a; --accent-red: #d97a63; --accent-green: #4fd18f;
    --line: rgba(238, 241, 246, 0.16); --notch: var(--bg);
    --shadow: 0 24px 70px -34px rgba(0, 0, 0, 0.65);
  }
  :root[data-theme="light"] {
    --bg: #f0f2f5; --bg-elevated: #ffffff; --ink: #1d233b; --ink-muted: #5f5f5f;
    --accent-gold: #c8940f; --accent-navy: #145a9f; --accent-navy-deep: #002d6c; --accent-red: #ae2329; --accent-green: #1f7a4d;
    --line: rgba(29, 35, 59, 0.14); --notch: var(--bg);
    --shadow: 0 24px 70px -34px rgba(29, 35, 59, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  ::selection { background: var(--accent-gold); color: var(--bg-elevated); }
  h1, h2, h3 { text-wrap: balance; margin: 0; font-family: var(--font-display); }

  .eyebrow { font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.16em; color: var(--accent-gold); text-transform: uppercase; }

  /* ---------- Chrome ---------- */
  .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 1rem clamp(1rem, 4vw, 2.5rem); gap: 1rem; background: var(--accent-navy-deep); border-bottom: 3px solid var(--accent-gold); }
  .topbar .brand { display: flex; align-items: baseline; gap: 0.6rem; font-family: var(--font-mono); font-size: 0.84rem; letter-spacing: 0.08em; color: rgba(238, 241, 246, 0.72); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .brand b { color: #eef1f6; font-weight: 700; letter-spacing: 0.14em; }
  .topbar-right { display: flex; align-items: center; gap: 0.9rem; flex: none; }
  #counter {
    font-family: var(--font-mono); font-size: 0.86rem; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    max-width: min(46vw, 320px); background: rgba(238, 241, 246, 0.1); color: #eef1f6; border: 1px solid rgba(238, 241, 246, 0.3); border-radius: 8px;
    padding: 0.35rem 1.6rem 0.35rem 0.6rem; cursor: pointer; appearance: none; -webkit-appearance: none;
    text-overflow: ellipsis;
    background-image: linear-gradient(45deg, transparent 50%, #eef1f6 50%), linear-gradient(135deg, #eef1f6 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  #counter:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
  #counter option { font-family: var(--font-mono); color: var(--ink); background: var(--bg-elevated); }
  .iconbtn { background: none; border: 1px solid rgba(238, 241, 246, 0.3); color: #eef1f6; width: 2.1rem; height: 2.1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; transition: border-color 0.2s; }
  .iconbtn:hover { border-color: var(--accent-gold); }
  .iconbtn:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }

  /* ---------- Deck ---------- */
  .deck { flex: 1; position: relative; overflow: hidden; }
  .track { display: flex; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1); }
  @media (prefers-reduced-motion: reduce) { .track { transition: none; } }
  .slide { flex: 0 0 100%; height: 100%; overflow-y: auto; display: flex; justify-content: center; }
  .ticket { position: relative; width: min(980px, 94vw); margin: clamp(1rem, 2.6vh, 2.2rem) 0; background: var(--bg-elevated); border-radius: 18px; box-shadow: var(--shadow); display: flex; min-height: calc(100% - 2.2rem); overflow: hidden; }

  .stub { flex: none; width: 100px; padding: 1.4rem 0.8rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; background: linear-gradient(180deg, var(--accent-navy), var(--accent-navy-deep)); color: #eef1f6; position: relative; }
  .stub::after {
    content: ""; position: absolute; top: 0; right: -9px; width: 18px; height: 100%;
    background-image: radial-gradient(circle 9px at 9px 0, transparent 9px, var(--notch) 9.5px), radial-gradient(circle 9px at 9px 100%, transparent 9px, var(--notch) 9.5px), repeating-linear-gradient(180deg, var(--bg-elevated) 0 10px, transparent 10px 20px);
    background-size: 18px 100%, 18px 100%, 2px 20px; background-repeat: no-repeat, no-repeat, repeat-y; background-position: left, left, calc(50% - 1px) 4px;
  }
  .stub .num { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-gold); }
  .stub .label { writing-mode: vertical-rl; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.18em; opacity: 0.85; }
  .stub .mark { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.14em; }

  .cabin { flex: 1; padding: clamp(1.5rem, 3.6vw, 2.8rem); min-width: 0; }
  .cabin .eyebrow { margin-bottom: 0.5rem; }
  .cabin h2 { font-size: clamp(1.9rem, 3.6vw, 2.7rem); font-weight: 700; margin-bottom: 0.5rem; position: relative; }
  .cabin h2::after { content: ""; display: block; width: 36px; height: 3px; margin-top: 0.6rem; margin-bottom: 0.6rem; background: var(--accent-gold); }
  .lede { color: var(--ink-muted); font-size: 1.15rem; line-height: 1.7; max-width: 68ch; }
  .placeholder { color: var(--accent-navy); font-style: normal; }
  .placeholder::before { content: "◻ "; }
  .tbd { color: var(--accent-red); font-size: 0.92rem; }
  .tbd::before { content: "△ 미확정 · "; font-weight: 600; }

  /* ---------- Seating (slide 1) ---------- */
  .seating .ticket { flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2.2rem 1.5rem; gap: 1.3rem; }
  .seating .stub { display: none; }
  .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.9rem; width: min(640px, 90vw); }
  @media (max-width: 520px) { .seat-grid { grid-template-columns: repeat(2, 1fr); } }
  .seat-box { aspect-ratio: 1; border-radius: 14px; border: 2px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 7%, var(--bg-elevated)); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 700; color: var(--accent-gold); }
  .seating .lede { max-width: 44ch; }

  /* ---------- Overview (Day1/2/3 summary) ---------- */
  .overview-grid { margin-top: 0.4rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  @media (max-width: 760px) { .overview-grid { grid-template-columns: 1fr; } }
  .overview-grid h3 { font-size: 0.92rem; color: var(--accent-navy); margin-bottom: 0.4rem; font-family: var(--font-mono); letter-spacing: 0.03em; }
  .overview-grid .timeline .row { grid-template-columns: 3rem 1fr; padding: 0.35rem 0; }
  .overview-grid .timeline time { font-size: 0.78rem; }
  .overview-grid .timeline .desc { font-size: 0.82rem; line-height: 1.35; }

  /* ---------- Timeline ---------- */
  .timeline { margin-top: 0.3rem; display: flex; flex-direction: column; }
  .timeline .row { display: grid; grid-template-columns: 4.2rem 1fr; gap: 0.9rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
  .timeline .row:last-child { border-bottom: none; }
  .timeline .row.dim { opacity: 0.55; }
  .timeline time { font-family: var(--font-mono); font-size: 0.98rem; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
  .timeline .desc { font-size: 1.08rem; }
  .timeline .desc small { display: block; color: var(--ink-muted); font-size: 0.9rem; margin-top: 0.15rem; }

  /* ---------- Team placeholder slides ---------- */
  .team-slide { display: flex; flex-direction: column; align-items: flex-start; gap: 1rem; }
  .team-badge { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 2.6rem; font-weight: 700; color: var(--accent-gold); background: color-mix(in srgb, var(--accent-gold) 8%, var(--bg-elevated)); }

  /* ---------- Speakers ---------- */
  .speaker-grid { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.9rem; }
  .speaker-card { border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); color: var(--accent-gold); font-size: 0.92rem; flex: none; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .speaker-card .name { font-weight: 700; font-size: 1.2rem; }
  .speaker-card .role, .speaker-card .topic { font-size: 0.98rem; color: var(--ink-muted); }
  .speaker-card .topic { color: var(--ink); }

  /* ---------- MC intro card (speaker / judge, read before they come up) ---------- */
  .mc-card { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; margin-top: 0.6rem; }
  .mc-photo-slot { flex: none; width: clamp(150px, 22vw, 220px); height: clamp(150px, 22vw, 220px); border-radius: 50%; border: 2px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.8rem; text-align: center; overflow: hidden; }
  .mc-photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .mc-card .name { font-size: 1.4rem; font-weight: 700; }
  .mc-card .role { color: var(--ink-muted); font-size: 1rem; margin-top: 0.2rem; }
  .mc-script { margin-top: 1.1rem; border-left: 3px solid var(--accent-gold); padding: 0.2rem 0 0.2rem 1rem; font-size: 1.05rem; line-height: 1.7; color: var(--ink); }

  /* ---------- Speaker detail (career list) ---------- */
  .speaker-detail-head { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; }
  .speaker-photo-slot { flex: none; width: clamp(170px, 24vw, 260px); height: clamp(170px, 24vw, 260px); border-radius: 50%; border: 2px dashed var(--line); background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.82rem; text-align: center; overflow: hidden; }
  .speaker-photo-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .speaker-org-badge { display: inline-block; align-self: flex-start; background: var(--accent-navy-deep); color: #eef1f6; font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em; padding: 0.25rem 0.7rem; border-radius: 20px; margin-bottom: 0.35rem; }
  .speaker-detail-head .name { font-size: 1.5rem; font-weight: 700; }
  .speaker-detail-head .topic { color: var(--accent-navy); font-size: 1.05rem; font-weight: 600; margin-top: 0.25rem; }
  .career-list { margin-top: 1.1rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .career-list .row { display: grid; grid-template-columns: 8.5rem 1fr; gap: 0.7rem; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .career-list .row:last-child { border-bottom: none; }
  .career-list .yr { font-family: var(--font-mono); font-size: 0.88rem; color: var(--accent-gold); font-variant-numeric: tabular-nums; }
  .career-list .desc { font-size: 1rem; line-height: 1.5; }
  @media (max-width: 560px) {
    .speaker-detail-head, .mc-card { flex-direction: column; align-items: flex-start; text-align: left; }
    .career-list .row { grid-template-columns: 1fr; gap: 0.15rem; }
  }

  /* ---------- Insert placeholder ---------- */
  .insert-box { margin-top: 1.1rem; border: 1.5px dashed var(--line); border-radius: 12px; padding: 1.6rem; text-align: center; color: var(--ink-muted); background: color-mix(in srgb, var(--accent-gold) 6%, var(--bg-elevated)); font-size: 1.05rem; min-height: 110px; display: flex; align-items: center; justify-content: center; }

  .photo-grid-lg { margin-top: 1.2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 620px) { .photo-grid-lg { grid-template-columns: 1fr; } }
  .photo-slot-lg { aspect-ratio: 4 / 3; border: 1.5px dashed var(--line); border-radius: 12px; background: color-mix(in srgb, var(--accent-navy) 6%, var(--bg-elevated)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.92rem; }
  .photo-slot-lg .cam { position: relative; width: 40px; height: 28px; border: 2px solid var(--ink-muted); border-radius: 5px; }
  .photo-slot-lg .cam::before { content: ""; position: absolute; top: -9px; left: 9px; width: 14px; height: 9px; background: var(--bg-elevated); border: 2px solid var(--ink-muted); border-bottom: none; border-radius: 3px 3px 0 0; }
  .photo-slot-lg .cam::after { content: ""; position: absolute; inset: 5px 12px; border: 2px solid var(--ink-muted); border-radius: 50%; }

  /* ---------- Shark Tank locations ---------- */
  .loc-grid { margin-top: 0.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.85rem; }
  .loc-card { border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem; background: color-mix(in srgb, var(--accent-navy) 5%, var(--bg-elevated)); }
  .loc-card .loc-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.4rem; }
  .tags { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.03em; padding: 0.15rem 0.45rem; border-radius: 20px; border: 1px solid var(--line); color: var(--ink-muted); }

  /* ---------- Route / movement map ---------- */
  .route-map { margin-top: 0.9rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .route-stop { border: 1px solid var(--line); border-radius: 10px; padding: 0.7rem 1rem; font-family: var(--font-mono); font-size: 0.92rem; background: var(--bg-elevated); }
  .route-arrow { color: var(--accent-gold); font-size: 1.3rem; }

  .plain-list { margin: 0; padding-left: 1.1rem; font-size: 1.08rem; line-height: 1.7; }
  .plain-list.ordered { padding-left: 1.3rem; }

  /* ---------- Day divider ---------- */
  .divider .ticket { align-items: stretch; }
  .divider .cabin { display: flex; flex-direction: column; justify-content: center; gap: 1.2rem; }
  .divider .daynum { font-family: var(--font-mono); font-size: clamp(3.2rem, 9vw, 5.2rem); font-weight: 700; color: var(--accent-gold); line-height: 1; }
  .divider .datestr { font-family: var(--font-mono); font-size: 1.12rem; color: var(--ink-muted); letter-spacing: 0.04em; }
  .divider .mini-agenda { margin-top: 0.5rem; }
  .divider .mini-agenda .row { grid-template-columns: 3.6rem 1fr; }

  /* ---------- Break slide ---------- */
  .break .ticket { align-items: center; justify-content: center; text-align: center; }
  .break .cabin { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
  .break .duration { font-family: var(--font-mono); font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 700; color: var(--accent-navy); }
  .break .next-up { font-size: 1.02rem; color: var(--ink-muted); }
  .break .next-up b { color: var(--ink); }

  /* coffee break cup animation */
  .coffee-cup { width: 72px; height: 60px; position: relative; margin: 0.4rem 0; }
  .coffee-cup .cup { position: absolute; bottom: 0; left: 8px; width: 56px; height: 38px; border: 3px solid var(--accent-navy); border-top: none; border-radius: 0 0 12px 12px; background: color-mix(in srgb, var(--accent-gold) 25%, var(--bg-elevated)); }
  .coffee-cup .handle { position: absolute; bottom: 10px; right: -6px; width: 16px; height: 16px; border: 3px solid var(--accent-navy); border-left: none; border-radius: 0 8px 8px 0; }
  .coffee-cup .steam { position: absolute; bottom: 40px; width: 3px; height: 16px; background: var(--ink-muted); border-radius: 2px; opacity: 0.6; animation: steam-rise 1.8s ease-in-out infinite; }
  .coffee-cup .steam.s1 { left: 18px; animation-delay: 0s; }
  .coffee-cup .steam.s2 { left: 30px; animation-delay: 0.4s; }
  .coffee-cup .steam.s3 { left: 42px; animation-delay: 0.8s; }
  @keyframes steam-rise { 0% { transform: translateY(0) scaleY(1); opacity: 0.6; } 100% { transform: translateY(-18px) scaleY(1.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .coffee-cup .steam { animation: none; opacity: 0.4; } }

  /* ---------- Ladder draw widget ---------- */
  .ladder-wrap { margin-top: 0.8rem; display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
  .ladder-svg-box { width: 100%; max-width: 620px; overflow-x: auto; }
  .ladder-svg-box svg { width: 100%; height: auto; display: block; }
  .ladder-col-label { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-muted); }
  .ladder-line { stroke: var(--line); stroke-width: 2; fill: none; }
  .ladder-path { stroke: var(--accent-gold); stroke-width: 3; fill: none; stroke-linecap: round; }
  .ladder-bottom-label { font-family: var(--font-mono); font-size: 16px; font-weight: 700; fill: var(--accent-gold); text-anchor: middle; }
  .ladder-actions { display: flex; gap: 0.7rem; }
  .ladder-actions button { font-family: var(--font-mono); font-size: 0.92rem; padding: 0.55rem 1.2rem; border-radius: 24px; border: 1px solid var(--accent-gold); background: var(--accent-gold); color: #241a04; cursor: pointer; font-weight: 600; }
  .ladder-actions button.secondary { background: none; color: var(--ink); border-color: var(--line); }
  .ladder-actions button:focus-visible { outline: 2px solid var(--accent-gold); outline-offset: 2px; }
  .ladder-result { width: 100%; max-width: 620px; }
  .ladder-result table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .ladder-result th, .ladder-result td { text-align: center; padding: 0.4rem 0.3rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ladder-result th { font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-muted); text-transform: uppercase; }
  .ladder-result td.hl { color: var(--accent-gold); font-weight: 700; }

  /* ---------- Spin wheel widget ---------- */
  .wheel-wrap { margin-top: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .wheel-stage { position: relative; width: clamp(200px, 40vw, 260px); height: clamp(200px, 40vw, 260px); }
  .wheel-disc { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--accent-navy-deep); background: conic-gradient(from 0deg, var(--accent-navy) 0deg 36deg, var(--accent-navy-deep) 36deg 72deg, var(--accent-navy) 72deg 108deg, var(--accent-navy-deep) 108deg 144deg, var(--accent-navy) 144deg 180deg, var(--accent-navy-deep) 180deg 216deg, var(--accent-navy) 216deg 252deg, var(--accent-navy-deep) 252deg 288deg, var(--accent-navy) 288deg 324deg, var(--accent-navy-deep) 324deg 360deg); box-shadow: var(--shadow); transition: transform 3.2s cubic-bezier(0.12, 0.72, 0.15, 1); }
  @media (prefers-reduced-motion: reduce) { .wheel-disc { transition: none; } }
  .wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-style: solid; border-width: 18px 10px 0 10px; border-color: var(--accent-gold) transparent transparent transparent; }
  .wheel-actions { display: flex; gap: 0.7rem; }

/* ===================== 슬라이드 렌더러 ===================== */

function timeline(rows) {
  return `<div class="timeline">${rows.map(r => `<div class="row${r[2] ? ' dim' : ''}"><time>${r[0]}</time><div class="desc">${r[1]}</div></div>`).join('')}</div>`;
}

function speakerGrid() {
  return `<div class="speaker-grid">${SPEAKERS.map(s => `
    <div class="speaker-card">
      <div class="avatar">${s.photo ? `<img src="${s.photo}" alt="${s.name}">` : s.name[0]}</div>
      <div class="name">${s.name}</div>
      <div class="role">${s.role}</div>
      <div class="topic">${s.topic}</div>
      <div class="role" style="font-family:var(--font-mono);font-size:0.85rem;">${s.time}</div>
    </div>`).join('')}</div>`;
}

function locationGrid() {
  return `<div class="loc-grid">${LOCATIONS.map(l => `
    <div class="loc-card">
      <div class="loc-name">${l.no} ${l.name}</div>
      <p class="tbd">세부 정보(임대료·면적·고객층 등) 확정 예정</p>
      <div class="tags">${l.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>`).join('')}</div>`;
}

function mcCard(name, role, topic, photo, script) {
  return `
    <div class="mc-card">
      <div class="mc-photo-slot">${photo ? `<img src="${photo}" alt="${name}">` : `<span>사진 삽입 예정</span>`}</div>
      <div>
        <div class="name">${name}</div>
        <div class="role">${role}</div>
        ${topic ? `<div class="role" style="color:var(--ink);">${topic}</div>` : ''}
      </div>
    </div>
    <div class="mc-script">${script}</div>
  `;
}

function speakerSlide(i) {
  const s = SPEAKERS[i];
  const d = SPEAKER_DETAILS[i];
  return `
    <div class="eyebrow">Special Lecture · ${s.time}</div>
    <h2>특강 — ${s.name}</h2>
    <div class="speaker-detail-head">
      <div class="speaker-photo-slot">${d.photo ? `<img src="${d.photo}" alt="${d.name}">` : `<span>강연자 사진<br>삽입 예정</span>`}</div>
      <div>
        <span class="speaker-org-badge">${d.org}</span>
        <div class="name">${d.name}</div>
        <div class="topic">${d.topic}</div>
      </div>
    </div>
    <div class="career-list">${d.career.map(([yr, desc]) => `<div class="row"><div class="yr">${yr}</div><div class="desc">${desc}</div></div>`).join('')}</div>
    <div class="insert-box"><span>이 영역에 <b>${s.name}</b> 강사님의 발표자료(PPT)를 삽입하세요</span></div>
  `;
}

function breakSlide(duration, nextLabel, nextDesc, withCoffee) {
  return `
    <div class="eyebrow">Break</div>
    <h2>잠시 쉬어갑니다</h2>
    ${withCoffee ? `<div class="coffee-cup"><span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span><div class="cup"></div><div class="handle"></div></div>` : ''}
    <div class="duration">${duration}</div>
    <div class="next-up">다음 순서 · <b>${nextLabel}</b><br>${nextDesc}</div>
  `;
}

function dayDivider(num, dateStr, items) {
  return `
    <div class="daynum">DAY ${num}</div>
    <div class="datestr">${dateStr}</div>
    <div class="mini-agenda">${timeline(items)}</div>
  `;
}

function teamSlide(n) {
  return `
    <div class="eyebrow">Team Introduction</div>
    <h2>${n}조 자기소개</h2>
    <div class="team-slide">
      <div class="team-badge">${n}</div>
      <p class="placeholder">조원 명단 및 소개 입력 예정</p>
    </div>
  `;
}

        <div><div class="sname">${s.name}</div><div class="sitem">${s.item}</div></div>
      </div>
    `).join('')}
  `},

  { stub: 'DAY 3', body: `
    <div class="eyebrow">Networking Party · 19:00–22:00</div>
    <h2>차세대 파티</h2>
    <p class="lede">참가비·찬조금 접수대, 식당 결제 정산 자료, 음향·음악 장비가 준비됩니다.</p>
    <p class="tbd">진행 시간 및 프로그램 사전 확인 필요</p>
  `},

  // info / notion link ------------------------------------------------------
  { stub: 'INFO', body: `
    <div class="eyebrow">전체 행사 안내 페이지</div>
    <h2>Notion에서 자세히 보기</h2>
    <p class="lede">일정, 팀 배정, 발표자료 등 최신 정보는 아래 Notion 페이지에서 확인하실 수 있습니다. QR 코드를 스캔하시면 바로 접속됩니다.</p>
    <div class="qr-card">
      <div class="qr-box"><img src="data:image/png;base64,` + QR_NOTION_B64 + `" alt="World OKTA 2026 Notion 페이지 QR 코드" /></div>
      <a class="qr-link" href="https://thankful-tugboat-273.notion.site/World-OKTA-2026-37c39ac4b869803bb4eee16720cc7590" target="_blank" rel="noopener">thankful-tugboat-273.notion.site/World-OKTA-2026</a>
    </div>
  `},

  // appendix (photo/video recap) --------------------------------------------
  { tag: 'appendix', body: `
    <div class="eyebrow">행사 사진 · 영상 모음</div>
    <h2>함께한 순간들</h2>
    <div class="video-box"><div class="play"></div><div>3일간 하이라이트 영상 · 사진 슬라이드쇼 삽입 영역</div></div>
    <p class="placeholder">행사 종료 후 사진/영상 추가 예정</p>
  `},
];

/* ===================== 렌더링 & 내비게이션 ===================== */

const track = document.getElementById('track');
SLIDES.forEach((s, i) => {
  const section = document.createElement('section');
  section.className = 'slide' + (s.tag === 'seating' ? ' seating' : s.tag === 'divider' ? ' divider' : s.tag === 'break' ? ' break' : s.tag === 'appendix' ? ' appendix' : '');
  if (s.tag === 'seating' || s.tag === 'appendix') {
    section.innerHTML = `<div class="ticket">${s.body}</div>`;
  } else {
    section.innerHTML = `
      <div class="ticket">
        <div class="stub"><span class="mark">OKTA</span><span class="label">${s.stub || ''}</span><span class="num">${String(i + 1).padStart(2, '0')}</span></div>
        <div class="cabin">${s.body}</div>
      </div>`;
  }
  track.appendChild(section);
});

const slides = document.querySelectorAll('.slide');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsWrap = document.getElementById('dots');
const fsBtn = document.getElementById('fsBtn');

const dots = Array.from(slides).map((_, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.setAttribute('aria-label', `슬라이드 ${i + 1}로 이동`);
  b.addEventListener('click', () => go(i));
  dotsWrap.appendChild(b);
  return b;
});

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
counter.innerHTML = Array.from(slides).map((section, i) => {
  let title = `슬라이드 ${i + 1}`;
  if (section.classList.contains('divider')) {
    const daynum = section.querySelector('.daynum');
    const datestr = section.querySelector('.datestr');
    title = [daynum, datestr].filter(Boolean).map((el) => el.textContent.trim()).join(' · ');
  } else if (section.classList.contains('break')) {
    const nextLabel = section.querySelector('.next-up b');
    title = 'BREAK' + (nextLabel ? ' · ' + nextLabel.textContent.trim() : '');
  } else {
    const heading = section.querySelector('h1, h2, .thanks');
    if (heading) {
      const clone = heading.cloneNode(true);
      clone.querySelectorAll('br').forEach((br) => br.replaceWith(' '));
      title = clone.textContent.replace(/\s+/g, ' ').trim();
    }
  }
  return `<option value="${i}">${String(i + 1).padStart(2, '0')} · ${escapeHtml(title)}</option>`;
}).join('');
counter.addEventListener('change', () => go(parseInt(counter.value, 10)));

let idx = 0;
function go(i) {
  idx = Math.max(0, Math.min(slides.length - 1, i));
  track.style.transform = `translateX(-${idx * 100}%)`;
  counter.value = String(idx);
  dots.forEach((d, i2) => d.classList.toggle('active', i2 === idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === slides.length - 1;
}
prevBtn.addEventListener('click', () => go(idx - 1));
nextBtn.addEventListener('click', () => go(idx + 1));

/* ---------------- keyboard shortcuts ---------------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function showSfxToast(label) {
  const toast = document.getElementById('sfxToast');
  toast.textContent = label;
  toast.classList.add('show');
  clearTimeout(showSfxToast._t);
  showSfxToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === ' ') { e.preventDefault(); go(idx + 1); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'r' || e.key === 'R') resetActiveLadder();
  const sfx = SFX_FILES.find((s) => s.key === e.key);
  if (sfx) {
    showSfxToast(sfx.label);
    const audio = new Audio(sfx.src);
    audio.play().catch(() => {});
  }
});
go(0);

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '⤢' : '⛶';
});

/* ===================== 사다리(Ladder) 위젯 ===================== */

let activeLadder = null;

function buildLadderData() {
  const cols = TEAMS.length;
  const rows = 14;
  const rungs = [];
  for (let r = 0; r < rows; r++) {
    const row = new Array(cols - 1).fill(false);
    let i = 0;
    while (i < cols - 1) {
      if (Math.random() < 0.35) { row[i] = true; i += 2; }
      else i += 1;
    }
    rungs.push(row);
  }
  // 완전 무작위 배정 (로케이션별 인원 균형 고려하지 않음)
  const bottomLocIdx = Array.from({ length: cols }, () => Math.floor(Math.random() * LOCATIONS.length));
  return { cols, rows, rungs, bottomLocIdx };
}

function traceLadder(data, startCol) {
  let c = startCol;
  const points = [];
  const colX = (col) => 40 + col * ((500 - 80) / (data.cols - 1));
  const rowH = 240 / data.rows;
  points.push([colX(c), 0]);
  for (let r = 0; r < data.rows; r++) {
    const row = data.rungs[r];
    const y0 = r * rowH, y1 = (r + 1) * rowH;
    let nc = c;
    if (c > 0 && row[c - 1]) nc = c - 1;
    else if (c < data.cols - 1 && row[c]) nc = c + 1;
    if (nc !== c) {
      points.push([colX(c), y0]);
      points.push([colX(nc), y1]);
    } else {
      points.push([colX(c), y1]);
    }
    c = nc;
  }
  points.push([colX(c), 280]);
  return { path: points, finalCol: c };
}

function renderLadder(container) {
  const data = buildLadderData();
  const svg = container.querySelector('[data-ladder-svg]');
  const resultBox = container.querySelector('[data-ladder-result]');
  resultBox.innerHTML = '';
  const colX = (col) => 40 + col * ((500 - 80) / (data.cols - 1));
  const rowH = 240 / data.rows;

  let svgContent = '';
  // 세로선
  for (let c = 0; c < data.cols; c++) {
    svgContent += `<line class="ladder-line" x1="${colX(c)}" y1="0" x2="${colX(c)}" y2="240"/>`;
    svgContent += `<text class="ladder-col-label" x="${colX(c)}" y="-6" text-anchor="middle" transform="translate(0,14)">${TEAMS[c]}조</text>`;
  }
  // 가로 rung
  for (let r = 0; r < data.rows; r++) {
    const y = (r + 0.5) * rowH;
    data.rungs[r].forEach((on, i) => {
      if (on) svgContent += `<line class="ladder-line" x1="${colX(i)}" y1="${y}" x2="${colX(i + 1)}" y2="${y}"/>`;
    });
  }
  // 하단 라벨 자리 (결과 공개 전에는 물음표)
  for (let c = 0; c < data.cols; c++) {
    svgContent += `<text class="ladder-bottom-label" data-bottom="${c}" x="${colX(c)}" y="270">?</text>`;
  }
  // 팀별 경로 (결과 공개 시 표시)
  const paths = TEAMS.map((_, startCol) => traceLadder(data, startCol));
  paths.forEach((p, i) => {
    const d = p.path.map((pt, j) => `${j === 0 ? 'M' : 'L'}${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(' ');
    const len = p.path.reduce((acc, pt, j) => j === 0 ? 0 : acc + Math.hypot(pt[0] - p.path[j - 1][0], pt[1] - p.path[j - 1][1]), 0);
    svgContent += `<path class="ladder-path" data-team-path="${i}" d="${d}" style="stroke-dasharray:${len};stroke-dashoffset:${len};opacity:0;"/>`;
  });

  svg.innerHTML = svgContent;

  activeLadder = { container, data, paths, revealed: false };

  const goBtn = container.querySelector('[data-ladder-go]');
  const resetBtn = container.querySelector('[data-ladder-reset]');
  goBtn.onclick = () => revealLadder(container);
  resetBtn.onclick = () => renderLadder(container);
}

function revealLadder(container) {
  if (!activeLadder || activeLadder.revealed) return;
  activeLadder.revealed = true;
  const svg = container.querySelector('[data-ladder-svg]');
  activeLadder.paths.forEach((p, i) => {
    const pathEl = svg.querySelector(`[data-team-path="${i}"]`);
    if (reduceMotion) {
      pathEl.style.opacity = '1';
      pathEl.style.strokeDashoffset = '0';
    } else {
      pathEl.style.transition = `stroke-dashoffset 1.1s ease ${i * 0.08}s, opacity 0.1s ease ${i * 0.08}s`;
      requestAnimationFrame(() => {
        pathEl.style.opacity = '1';
        pathEl.style.strokeDashoffset = '0';
      });
    }
  });
  // 하단 라벨을 로케이션 기호(①②③④)로 교체 — 전체 이름은 위 범례와 결과 테이블에서 확인
  activeLadder.data.bottomLocIdx.forEach((locIdx, col) => {
    const el = svg.querySelector(`[data-bottom="${col}"]`);
    if (el) el.textContent = LOCATIONS[locIdx].no;
  });
  // 결과 테이블
  const resultBox = container.querySelector('[data-ladder-result]');
  const rows = activeLadder.paths.map((p, i) => `<tr><td class="hl">${TEAMS[i]}조</td><td>${LOCATIONS[activeLadder.data.bottomLocIdx[p.finalCol]].no} ${LOCATIONS[activeLadder.data.bottomLocIdx[p.finalCol]].name}</td></tr>`).join('');
  const delay = reduceMotion ? 0 : (activeLadder.paths.length * 80 + 1100);
  setTimeout(() => {
    resultBox.innerHTML = `<table><thead><tr><th>조</th><th>배정 로케이션</th></tr></thead><tbody>${rows}</tbody></table>`;
  }, delay);
}

function resetActiveLadder() {
  if (activeLadder) renderLadder(activeLadder.container);
}

document.querySelectorAll('[data-ladder]').forEach((el) => renderLadder(el));

/* ===================== 스핀 휠 위젯 (발표 순서 추첨) ===================== */

document.querySelectorAll('[data-wheel]').forEach((wrap) => {
  const disc = wrap.querySelector('[data-wheel-disc]');
  const goBtn = wrap.querySelector('[data-wheel-go]');
  const resultEl = wrap.querySelector('[data-wheel-result]');
  let spinning = false;
  let currentAngle = 0;
  goBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    resultEl.innerHTML = '';
    const order = [...TEAMS];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    currentAngle += 1080 + Math.floor(Math.random() * 360);
    if (reduceMotion) {
      showWheelResult();
    } else {
      disc.style.transform = `rotate(${currentAngle}deg)`;
      disc.addEventListener('transitionend', showWheelResult, { once: true });
    }
    function showWheelResult() {
      resultEl.innerHTML = order.map((n) => `<li>${n}조</li>`).join('');
      spinning = false;
    }
  });
});

/* ===================== Global Mixer 궤도 애니메이션 ===================== */

document.querySelectorAll('[data-mixer]').forEach((wrap) => {
  const orbit = wrap.querySelector('[data-mixer-orbit]');
  const chips = wrap.querySelectorAll('[data-mixer-chip]');
  const goBtn = wrap.querySelector('[data-mixer-go]');
  const groupsBox = wrap.querySelector('[data-mixer-groups]');
  goBtn.addEventListener('click', () => {
    const finalAngle = 720 + Math.floor(Math.random() * 360);
    orbit.style.setProperty('--final-angle', finalAngle + 'deg');
    orbit.classList.remove('spin'); void orbit.offsetWidth; orbit.classList.add('spin');
    chips.forEach((chip) => {
      chip.style.setProperty('--final-angle', finalAngle + 'deg');
      chip.classList.remove('spin'); void chip.offsetWidth; chip.classList.add('spin');
    });
    const delay = reduceMotion ? 0 : 2400;
    setTimeout(() => groupsBox.classList.add('show'), delay);
  });
});

</script>
