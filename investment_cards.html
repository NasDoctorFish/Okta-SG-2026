<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>심사위원 투자 의향 카드 — 2026 아세안 차세대 글로벌 창업무역스쿨</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; margin: 0; color: #1d233b; }
  .toolbar { padding: 1rem; background: #f0f2f5; display: flex; align-items: center; gap: 1rem; }
  .toolbar button { font-size: 1rem; padding: 0.6rem 1.4rem; border-radius: 8px; border: none; background: #002d6c; color: #fff; cursor: pointer; }
  .toolbar span { color: #5f5f5f; font-size: 0.9rem; }
  .sheet { width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm; background: #fff; display: flex; flex-direction: column; gap: 8mm; }
  .card { flex: 1; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.8rem; color: #fff; position: relative; }
  .card .icon { font-size: 4.5rem; line-height: 1; }
  .card .label { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.01em; }
  .card .sub { font-size: 1.15rem; opacity: 0.92; }
  .card .cutline { position: absolute; inset: 4mm; border: 2px dashed rgba(255,255,255,0.55); border-radius: 14px; pointer-events: none; }
  .green { background: #1f7a4d; }
  .yellow { background: #a67c00; }
  .red { background: #ae2329; }
  @media print {
    .toolbar { display: none; }
    .sheet { width: auto; min-height: auto; padding: 6mm; }
    @page { size: A4 portrait; margin: 6mm; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">인쇄</button>
    <span>인쇄 대화상자에서 매수 15로 설정해 출력한 뒤, 점선을 따라 3장씩 잘라 심사위원 1인당 초록·진한노랑·빨강 1세트씩 배부하세요.</span>
  </div>
  <div class="sheet">
    <div class="card green"><div class="cutline"></div><div class="icon">👍</div><div class="label">투자 의향 있음</div><div class="sub">GO</div></div>
    <div class="card yellow"><div class="cutline"></div><div class="icon">🤔</div><div class="label">조건부 · 보류</div><div class="sub">CONDITIONAL</div></div>
    <div class="card red"><div class="cutline"></div><div class="icon">👎</div><div class="label">투자 의향 없음</div><div class="sub">NO GO</div></div>
  </div>
</body>
</html>
